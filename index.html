 turning the cutoff knob live. What do you set first?","options":["Tick Automation in the Record menu","Tick Audio in the Record menu","Arm the Mixer track for recording","Turn on Apply tempo in the Tapper"],"answer":0,"explanation":"Right-click the main Record button and tick Automation, then record while turning the knob. Ticking Audio records sound, not knob movements.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"mcq-24-2","topic":"24 Recording & Editing Automation","question":"Recording automation by turning a knob first creates what?","options":["An Automation Clip","Event Data","An Audio Clip","A Pattern Clip"],"answer":1,"explanation":"Recorded automation becomes Event Data, which you edit in the Event Editor. It only becomes an Automation Clip if you convert it.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"mcq-24-3","topic":"24 Recording & Editing Automation","question":"How do you turn recorded Event Data into an Automation Clip?","options":["Right-click the knob > Create automation clip","File > New from template","Edit > Turn into automation clip","Helpers > Scale highlighting"],"answer":2,"explanation":"Edit > Turn into automation clip converts recorded Event Data. Create automation clip on a knob makes a new empty clip instead of converting your recording.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"mcq-24-4","topic":"24 Recording & Editing Automation","question":"After creating an Automation Clip manually, how do you shape the parameter change?","options":["Drag the slot labels into order","Tap the TAP button in time","Turn the knob while recording","Draw control points on the clip"],"answer":3,"explanation":"Use the Draw tool to place control points on the clip and shape the curve. Turning the knob while recording is the other method, and it creates Event Data.","source":"§ 24 Recording & Editing Automation > B. Create an Automation Clip manually"},{"id":"mcq-25-1","topic":"25 Mixing & Effects","question":"What is the main aim of mixing?","options":["Sounds coexist without masking each other","Every track is as loud as possible","All sounds share one Insert track","The Master meter stays in the red"],"answer":0,"explanation":"Mixing makes sounds coexist in volume, frequency and space without masking. The Master meter should not be constantly red.","source":"§ 25 Mixing & Effects"},{"id":"mcq-25-2","topic":"25 Mixing & Effects","question":"Which plugins does the source list for compression?","options":["Fruity Parametric EQ 2","Fruity Compressor / Fruity Limiter","Fruity Reeverb 2","Sytrus / FLEX"],"answer":1,"explanation":"Fruity Compressor and Fruity Limiter are named for compression. Fruity Parametric EQ 2 is the EQ.","source":"§ 25 Mixing & Effects > Core workflow > Effects processing"},{"id":"mcq-25-3","topic":"25 Mixing & Effects","question":"You want the vocal and the snare to sit in the same reverb space. What does the source suggest?","options":["Put reverb in slot 1 of each track","Route both to the Master only","Use Sends to share one reverb","Sidechain the vocal to the snare"],"answer":2,"explanation":"Sends share one reverb or delay so several sounds sit in the same space. Sidechain is for ducking, not shared space.","source":"§ 25 Mixing & Effects > Core workflow > Effects processing"},{"id":"mcq-25-4","topic":"25 Mixing & Effects","question":"In the source's sidechain example, what happens to the bass?","options":["It triggers the kick's compressor","It is routed to the Master only","It is soloed when the kick plays","It ducks when the kick hits"],"answer":3,"explanation":"The kick triggers a compressor on the bass, so the bass ducks. The bass is the sound being compressed, not the trigger.","source":"§ 25 Mixing & Effects > Core workflow > Sidechain"},{"id":"mcq-26-1","topic":"26 Plugins","question":"What does a Generator plugin do?","options":["Produces sound","Processes sound","Routes sound","Records sound"],"answer":0,"explanation":"Generators (instruments) produce sound. Effects are the plugins that process sound.","source":"§ 26 Plugins"},{"id":"mcq-26-2","topic":"26 Plugins","question":"Which of these is an Effect plugin?","options":["Sytrus","Fruity Reeverb 2","FLEX","Sampler"],"answer":1,"explanation":"Fruity Reeverb 2 processes sound, so it is an Effect. Sytrus, FLEX and the Sampler are Generators.","source":"§ 26 Plugins"},{"id":"mcq-26-3","topic":"26 Plugins","question":"You press F8. Which window opens to let you choose Generator and Effect plugins?","options":["Browser","Plugin Manager","Plugin Picker","Channel Rack"],"answer":2,"explanation":"F8 opens the Plugin Picker, which manages plugins. The Browser opens with Alt/Opt + F8 instead.","source":"§ 26 Plugins"},{"id":"mcq-26-4","topic":"26 Plugins","question":"What 2025 change lets you fix a plugin that is listed under the wrong type?","options":["Plugin Picker adds it to Favorites","Browser moves it to Current project","Loop Starter regroups it by genre","Plugin Manager can change its type"],"answer":3,"explanation":"The Plugin Manager can now change a plugin's type, e.g. Effect to Generator, after verification. Favorites only move it to the top of the list.","source":"§ 26 Plugins > Management tips > 2025 improvement"},{"id":"mcq-27-1","topic":"27 Music Theory & Terminology for FL Studio","question":"What is middle C called in FL Studio's default naming?","options":["C5","C4","C3","C6"],"answer":0,"explanation":"FL Studio names middle C as C5. C4 is the octave below in FL's naming.","source":"§ 27 Music Theory & Terminology for FL Studio > Pitch"},{"id":"mcq-27-2","topic":"27 Music Theory & Terminology for FL Studio","question":"Two notes share the same letter name and one has double the frequency. What interval separates them?","options":["A semitone","An octave","A chord","A bar"],"answer":1,"explanation":"An octave is double or half the frequency, with the same letter name. A semitone is the smallest interval, one grid step.","source":"§ 27 Music Theory & Terminology for FL Studio > Octave"},{"id":"mcq-27-3","topic":"27 Music Theory & Terminology for FL Studio","question":"What is the smallest interval in Western music, equal to one step on the Piano Roll grid?","options":["An octave","A beat","A semitone","A key"],"answer":2,"explanation":"A semitone is one piano key or one Piano Roll grid step. An octave is a much larger interval.","source":"§ 27 Music Theory & Terminology for FL Studio > Semitone (Half Step)"},{"id":"mcq-27-4","topic":"27 Music Theory & Terminology for FL Studio","question":"In 4/4 time, how many beats are usually in a bar?","options":["16","8","3","4"],"answer":3,"explanation":"A bar usually has 4 beats in 4/4. 16 is the number of Step Sequencer steps per bar.","source":"§ 27 Music Theory & Terminology for FL Studio > Beat & Bar"},{"id":"mcq-27-5","topic":"27 Music Theory & Terminology for FL Studio","question":"A piano and a guitar play the same pitch but sound different. What is that difference called?","options":["Timbre","Velocity","Harmony","Rhythm"],"answer":0,"explanation":"Timbre is the character or colour of a sound. Velocity is how hard a note is played, which changes loudness.","source":"§ 27 Music Theory & Terminology for FL Studio > Timbre (Tone Colour)"},{"id":"mcq-27-6","topic":"27 Music Theory & Terminology for FL Studio","question":"What does 'key' mean?","options":["A set of notes in ascending order","The central note a piece is built around","Three or more notes played together","The pattern of sounds in time"],"answer":1,"explanation":"The key is the central note a piece is built around, e.g. C major. A set of notes in order is a scale.","source":"§ 27 Music Theory & Terminology for FL Studio > Key"}]};
const N = 20;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KEY = "Shift|Ctrl|Alt\\/Opt|Alt|Space|F\\d{1,2}|[A-Z]|↑\\/↓|↑|↓";
const KRE = new RegExp(`((?:${KEY})(?: \\+ (?:${KEY}))+|\\bF\\d{1,2}\\b)`, "g");
const fmt = s => esc(s).replace(KRE, m => m.split(" + ").map(k => `<kbd>${k}</kbd>`).join(" + "));
const pad2 = n => String(n).padStart(2, "0");
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tnum = item => parseInt(item.topic, 10);
const TOPIC = Object.fromEntries(DATA.topics.map(t => [t.n, t]));
const stage = $("#stage");
const TOUCH = matchMedia("(pointer: coarse)").matches;

// 7-segment LCD digits
const SEG = {a: [3, .6, 8, 2], b: [11.4, 3, 2, 8], c: [11.4, 13, 2, 8], d: [3, 21.4, 8, 2], e: [.6, 13, 2, 8], f: [.6, 3, 2, 8], g: [3, 11, 8, 2]};
const MAP = {0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg", "-": "g", " ": ""};
function digit(ch) {
  if (ch === "/") return '<svg viewBox="0 0 9 24" aria-hidden="true"><path d="M7.5 1.5L1.5 22.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  const on = MAP[ch] ?? "";
  return '<svg viewBox="0 0 16 24" aria-hidden="true"><g transform="skewX(-6) translate(2.4 0)">' +
    Object.entries(SEG).map(([k, [x, y, w, h]]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" class="${on.includes(k) ? "on" : "off"}"/>`).join("") + "</g></svg>";
}
const segHTML = v => [...v].map(digit).join("");
function setLCD(label, value, spoken) {
  $("#lcd-label").textContent = label;
  const el = $("#lcd");
  el.innerHTML = segHTML(value);
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", spoken || value);
}
function setHint(k, t, s) {
  $("#hint").innerHTML = `<span class="hint-k">${esc(k)}</span>` + (t ? `<span class="hint-t">${esc(t)}</span>` : "") + (s ? `<span class="hint-s">${esc(s)}</span>` : "");
}
const say = msg => { const l = $("#live"); l.textContent = ""; requestAnimationFrame(() => l.textContent = msg); };
const topicLabel = n => `${n} ${TOPIC[n].title}`;

// ---------- state ----------
const S = {
  view: "fc",
  fc: {cards: [], i: 0, flipped: false, seen: new Set()},
  quiz: null,
  qn: {q: "", open: new Set(), all: false},
  fn: {t: 1, drawer: false},
};
const VIEWS = {fc: "flashcards", quiz: "quiz", qn: "quick-notes", fn: "full-notes"};
const HASH = Object.fromEntries(Object.entries(VIEWS).map(([k, v]) => [v, k]));

function newSet(exclude = new Set()) {
  const fresh = DATA.fc.filter(c => !exclude.has(c.id));
  let pick = shuffle(fresh).slice(0, N);
  if (pick.length < N) pick = pick.concat(shuffle(DATA.fc.filter(c => !pick.includes(c))).slice(0, N - pick.length));
  Object.assign(S.fc, {cards: pick, i: 0, flipped: false, seen: new Set([0])});
}
function newQuiz() {
  S.quiz = {items: shuffle(DATA.mcq).slice(0, N).map(m => ({m, order: shuffle([0, 1, 2, 3])})), i: 0, ans: [], done: false};
}

// ---------- view switching ----------
function setView(v, push = true) {
  if (!VIEWS[v]) v = "fc";
  S.view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.dataset.view === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (push && location.hash.slice(1) !== VIEWS[v]) history.replaceState(null, "", "#" + VIEWS[v]);
  render();
  window.scrollTo(0, 0);
}
function render() { ({fc: renderFC, quiz: renderQuiz, qn: renderQN, fn: renderFN})[S.view](); }

// ---------- flashcards ----------
function renderFC() {
  const F = S.fc, c = F.cards[F.i], n = tnum(c);
  let pads = "";
  for (let k = 0; k < N; k++) {
    const cls = (Math.floor(k / 5) % 2 ? " g2" : "") + (k === F.i ? " current" : F.seen.has(k) ? " visited" : "");
    pads += `<button class="pad${cls}" data-jump="${k}" aria-label="Card ${k + 1}${k === F.i ? ", current" : F.seen.has(k) ? ", seen" : ""}"${k === F.i ? ' aria-current="step"' : ""}>${k + 1}</button>`;
  }
  stage.innerHTML = `<section class="fc" aria-labelledby="fc-title">
    <div class="win">
      <div class="win-bar"><span class="led on"></span><h2 class="win-title" id="fc-title">Flashcard ${pad2(F.i + 1)}</h2><span class="win-meta" id="fc-side"></span></div>
      <button class="card" id="card" aria-describedby="fc-help">
        <span class="card-inner">
          <span class="face front"><span class="card-eyebrow">Question</span><span class="card-q">${fmt(c.front)}</span>
            <span class="card-hint" id="fc-help">${icon("i-flip")}${TOUCH ? "Tap to flip · swipe left or right to move" : "Tap the card or press <kbd>Space</kbd> to flip"}</span></span>
          <span class="face back"><span class="card-eyebrow">Answer</span><span class="card-a">${fmt(c.back)}</span>
            <span class="card-src"><span class="chip">${esc(topicLabel(n))}</span><span class="src">${esc(c.source)}</span></span></span>
        </span>
      </button>
    </div>
    <div class="steps" role="group" aria-label="Jump to card">${pads}</div>
    <div class="transport">
      <div class="tp"><button class="btn" data-act="prev" aria-label="Previous card"${F.i === 0 ? " disabled" : ""}>${icon("i-prev")}Prev</button><button class="btn btn--amber" data-act="flip">${icon("i-flip")}Flip</button><button class="btn" data-act="next" aria-label="Next card"${F.i === N - 1 ? " disabled" : ""}>Next${icon("i-next")}</button></div>
      <div class="tp"><button class="btn" data-act="shuffle">${icon("i-shuffle")}Shuffle</button><button class="btn" data-act="newset">${icon("i-new")}New set</button></div>
    </div>
  </section>`;
  setLCD("Card", `${pad2(F.i + 1)}/${N}`, `Card ${F.i + 1} of ${N}`);
  paintFlip();
  bindSwipe($("#card"));
}
function paintFlip() {
  const F = S.fc, c = F.cards[F.i], card = $("#card");
  card.classList.toggle("is-flipped", F.flipped);
  card.querySelector(".front").setAttribute("aria-hidden", F.flipped);
  card.querySelector(".back").setAttribute("aria-hidden", !F.flipped);
  card.setAttribute("aria-label", F.flipped ? "Answer side. Activate to show the question" : "Question side. Activate to show the answer");
  $("#fc-side").textContent = F.flipped ? "back" : "front";
  setHint("Topic", topicLabel(tnum(c)), F.flipped ? c.source : "");
}
function flip() { S.fc.flipped = !S.fc.flipped; paintFlip(); }
function goCard(k) {
  const F = S.fc;
  if (k < 0 || k >= N || k === F.i) return;
  F.i = k; F.flipped = false; F.seen.add(k);
  renderFC();
  say(`Card ${k + 1} of ${N}`);
}
// lastSwipe lives outside the card element: a swipe re-renders the card, and a browser click that follows must still be ignored
let lastSwipe = 0;
function bindSwipe(el) {
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { if (e.touches.length !== 1) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  el.addEventListener("touchcancel", () => { x0 = null; });
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    // mostly-horizontal and long enough: a natural thumb arc counts, a vertical scroll doesn't
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { lastSwipe = Date.now(); goCard(S.fc.i + (dx < 0 ? 1 : -1)); }
  });
}

// ---------- quiz ----------
function renderQuiz() {
  if (!S.quiz) newQuiz();
  const Q = S.quiz;
  if (Q.done) return renderResults();
  const {m, order} = Q.items[Q.i], chosen = Q.ans[Q.i], answered = chosen !== undefined;
  const correct = order.indexOf(m.answer), n = tnum(m);
  const opts = order.map((oi, d) => {
    let cls = "", led = "", mark = "", sr = "";
    if (answered) {
      if (d === correct) { cls = " is-ok"; led = " ok"; mark = "✓"; sr = d === chosen ? "Your answer. Correct." : "Correct answer."; }
      else if (d === chosen) { cls = " is-bad"; led = " bad"; mark = "✗"; sr = "Your answer. Wrong."; }
      else cls = " is-locked";
    }
    return `<button class="opt${cls}" data-opt="${d}"${answered ? " disabled" : ""}><span class="led${led}"></span><span class="key" aria-hidden="true">${"ABCD"[d]}</span><span>${fmt(m.options[oi])}</span><span class="mark" aria-hidden="true">${mark}</span>${sr ? `<span class="sr">${sr}</span>` : ""}</button>`;
  }).join("");
  const right = chosen === correct, last = Q.i === N - 1;
  stage.innerHTML = `<section class="quiz" aria-labelledby="q-title">
    <div class="win">
      <div class="win-bar"><span class="led on"></span><h2 class="win-title" id="q-title" tabindex="-1">Question ${pad2(Q.i + 1)} of ${N}</h2><span class="win-meta">${answered ? "answered" : "pick one"}</span></div>
      <div class="q-face"><p class="q-text" id="q-text">${fmt(m.question)}</p></div>
    </div>
    <div class="opts" role="group" aria-labelledby="q-text">${opts}</div>
    ${answered ? `<div class="explain">
      <div class="ex-head ${right ? "ok" : "bad"}"><span class="led ${right ? "ok" : "bad"}"></span>${right ? "✓ Correct" : `✗ Not quite. The answer is ${"ABCD"[correct]}`}</div>
      <p>${fmt(m.explanation)}</p>
      <div class="ex-foot"><span class="src">${esc(m.source)}</span><button class="btn btn--amber" id="next" data-act="qnext">${last ? "See results" : "Next"}${icon("i-next")}</button></div>
    </div>` : ""}
  </section>`;
  setLCD("Q", `${pad2(Q.i + 1)}/${N}`, `Question ${Q.i + 1} of ${N}`);
  answered ? setHint("Topic", topicLabel(n), m.source) : setHint("Topic", "", "Hidden until you answer");
}
function answer(d) {
  const Q = S.quiz;
  if (Q.done || Q.ans[Q.i] !== undefined) return;
  Q.ans[Q.i] = d;
  renderQuiz();
  const {m, order} = Q.items[Q.i];
  say(d === order.indexOf(m.answer) ? "Correct." : `Wrong. The correct answer is ${"ABCD"[order.indexOf(m.answer)]}.`);
  $("#next").focus({preventScroll: true});
}
function quizNext() {
  const Q = S.quiz;
  if (Q.i < N - 1) { Q.i++; renderQuiz(); $("#q-title").focus(); }
  else { Q.done = true; renderQuiz(); window.scrollTo(0, 0); $("#res-title").focus(); }
}
function renderResults() {
  const Q = S.quiz, per = {};
  let score = 0;
  const missed = [];
  Q.items.forEach(({m, order}, k) => {
    const n = tnum(m), ok = Q.ans[k] === order.indexOf(m.answer);
    per[n] = per[n] || [0, 0];
    per[n][1]++;
    if (ok) { per[n][0]++; score++; } else missed.push({m, order, chosen: Q.ans[k]});
  });
  const pct = Math.round(score / N * 100);
  const meter = (p, segs) => Array.from({length: segs}, (_, i) => (i + 1) / segs * 100 <= p + .01 ? `<i class="on" style="--d:${i * 15}ms"></i>` : "<i></i>").join("");
  const strips = Object.keys(per).map(Number).sort((a, b) => a - b).map(n => {
    const [c, t] = per[n], p = Math.round(c / t * 100);
    return `<div class="strip" role="img" aria-label="Topic ${n}, ${esc(TOPIC[n].title)}: ${c} of ${t} correct"><span class="s-num">${pad2(n)}</span><div class="s-meter"><div class="meter">${meter(p, 12)}</div><div class="fader"><span class="cap" style="--p:${p}%"></span></div></div><span class="s-score">${c}/${t}</span><span class="s-name">${esc(TOPIC[n].short)}</span></div>`;
  }).join("");
  const missedHTML = missed.map(({m, order, chosen}) => `<li class="miss">
    <p class="miss-q">${fmt(m.question)}</p>
    <div class="miss-row bad"><b aria-hidden="true">✗</b><span><small>Your answer</small>${fmt(m.options[order[chosen]])}</span></div>
    <div class="miss-row ok"><b aria-hidden="true">✓</b><span><small>Correct answer</small>${fmt(m.options[m.answer])}</span></div>
    <p>${fmt(m.explanation)} <span class="src">${esc(m.source)}</span></p></li>`).join("");
  stage.innerHTML = `<section class="results" aria-labelledby="res-title">
    <div class="win">
      <div class="win-bar"><span class="led on"></span><h2 class="win-title" id="res-title" tabindex="-1">Mixer · Results by topic</h2><span class="win-meta">${Object.keys(per).length} topics</span></div>
      <div class="mixer-body">
        <div class="master" role="img" aria-label="Total: ${score} out of ${N}, ${pct}% correct">
          <span class="m-label">MASTER</span>
          <span class="lcd"><span class="seg">${segHTML(`${pad2(score)}/${N}`)}</span></span>
          <div class="meter">${meter(pct, 16)}</div>
          <span class="m-pct">${pct}% correct</span>
        </div>
        <div class="strips">${strips}</div>
      </div>
    </div>
    <h2 class="h2">${missed.length ? `Missed questions · ${missed.length}` : "Missed questions · 0"}</h2>
    ${missed.length ? `<ol class="missed">${missedHTML}</ol>` : `<p class="perfect">✓ You got all ${N} right.</p>`}
    <div class="res-foot"><button class="btn btn--amber" data-act="newquiz">${icon("i-new")}New quiz</button></div>
  </section>`;
  setLCD("Score", `${pad2(score)}/${N}`, `Score ${score} out of ${N}`);
  setHint("Results", `${score} of ${N} correct`, missed.length ? `${missed.length} missed questions below` : "No missed questions");
}

// ---------- quick notes ----------
function renderQN() {
  stage.innerHTML = `<section class="qn" aria-labelledby="qn-title">
    <div class="win">
      <div class="win-bar"><span class="led on"></span><h2 class="win-title" id="qn-title">Quick Notes · Browser</h2><span class="win-meta" id="qn-meta">27 folders</span></div>
      <div class="qn-tools">
        <label class="search">${icon("i-search")}<span class="sr">Search all quick notes</span><input type="search" id="qn-q" placeholder="Search all notes" autocomplete="off" value="${esc(S.qn.q)}"></label>
        <button class="btn toggle" id="qn-all" aria-pressed="${S.qn.all}"><span class="led"></span>Expand all</button>
      </div>
      <div class="qn-count" id="qn-count" hidden></div>
      <ul class="folders" id="folders"></ul>
    </div>
  </section>`;
  paintFolders();
}
function paintFolders() {
  const q = S.qn.q.trim().toLowerCase();
  let hits = 0, folders = 0;
  const html = DATA.topics.map(t => {
    let items = t.quick.map((h, k) => ({h, txt: t.quickText[k]}));
    if (q) {
      const m = items.filter(it => it.txt.toLowerCase().includes(q));
      if (!m.length && !t.title.toLowerCase().includes(q)) return "";
      if (m.length) items = m;
      hits += m.length; folders++;
    }
    const open = !!q || S.qn.all || S.qn.open.has(t.n);
    return `<li><button class="folder" data-folder="${t.n}" aria-expanded="${open}"${open ? ` aria-controls="b${t.n}"` : ""}>${icon("i-chev", "chev")}${icon("i-folder", "fic")}<span class="f-num">${pad2(t.n)}</span><span class="f-name">${esc(t.title)}</span><span class="f-count">${items.length}</span></button>${open ? `<ul class="bullets" id="b${t.n}">${items.map(it => `<li>${it.h}</li>`).join("")}</ul>` : ""}</li>`;
  }).join("");
  const ul = $("#folders");
  ul.innerHTML = html || `<li class="empty">No notes match “${esc(S.qn.q.trim())}”.</li>`;
  const count = $("#qn-count");
  count.hidden = !q;
  if (q) {
    count.textContent = `${hits} matching ${hits === 1 ? "note" : "notes"} in ${folders} ${folders === 1 ? "folder" : "folders"}`;
    highlight(ul, q);
  }
  $("#qn-meta").textContent = q ? "filtered" : "27 folders";
  q ? setLCD("Hits", pad2(Math.min(hits, 99)), `${hits} matches`) : setLCD("Topics", "27", "27 topics");
  q ? setHint("Search", `“${S.qn.q.trim()}”`, count.textContent) : setHint("Quick notes", "Last-minute read", "3–7 bullets per topic");
}
function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest(".bullets,.f-name") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT});
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const s = node.nodeValue, low = s.toLowerCase();
    let i = low.indexOf(q);
    if (i < 0) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    while (i >= 0) {
      frag.append(s.slice(last, i));
      const mk = document.createElement("mark");
      mk.textContent = s.slice(i, i + q.length);
      frag.append(mk);
      last = i + q.length;
      i = low.indexOf(q, last);
    }
    frag.append(s.slice(last));
    node.replaceWith(frag);
  });
}

// ---------- full notes ----------
function renderFN() {
  const t = S.fn.t, G = t === 28;
  const list = DATA.topics.map(x => `<button class="folder" data-topic="${x.n}"${x.n === t ? ' aria-current="true"' : ""}><span class="led"></span><span class="f-num">${pad2(x.n)}</span><span class="f-name">${esc(x.title)}</span></button>`).join("") +
    `<button class="folder" data-topic="28"${G ? ' aria-current="true"' : ""}><span class="led"></span><span class="f-num">A–Z</span><span class="f-name">Glossary</span></button>`;
  let body;
  if (G) {
    body = `<h1 id="doc-h">Glossary</h1><span class="src">§ Glossary · ${DATA.glossary.length} terms</span>
      <div class="tbl"><table><thead><tr><th>Term</th><th>Meaning</th><th>§</th></tr></thead><tbody>${DATA.glossary.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    const x = TOPIC[t];
    body = `<h1 id="doc-h">${t} · ${esc(x.title)}</h1><span class="src">${esc(x.src)}</span>
      <h2>Full notes</h2>${x.full}<h2>Quick notes</h2><ul>${x.quick.map(h => `<li>${h}</li>`).join("")}</ul>`;
  }
  const prev = t > 1 ? t - 1 : null, next = t < 28 ? t + 1 : null;
  const nm = k => k === 28 ? "Glossary" : `${k} ${TOPIC[k].title}`;
  stage.innerHTML = `<section class="fn${S.fn.drawer ? " drawer-open" : ""}" id="fn">
    <div class="fn-tools"><button class="btn" id="tree-btn" aria-expanded="${S.fn.drawer}" aria-controls="tree">${icon("i-menu")}Topics</button><span class="fn-cur">${esc(G ? "Glossary" : `${t} · ${TOPIC[t].title}`)}</span></div>
    <div class="scrim" data-act="closetree"></div>
    <aside class="win tree" id="tree" aria-label="Topics">
      <div class="win-bar"><span class="led on"></span><h2 class="win-title">Topics</h2><span class="win-meta">27 + glossary</span></div>
      <div class="tree-list">${list}</div>
    </aside>
    <article class="doc" id="doc" aria-labelledby="doc-h">${body}
      <nav class="doc-nav" aria-label="Topic navigation">${prev ? `<button class="btn" data-topic="${prev}">${icon("i-prev")}${esc(nm(prev))}</button>` : "<span></span>"}${next ? `<button class="btn" data-topic="${next}">${esc(nm(next))}${icon("i-next")}</button>` : ""}</nav>
    </article>
  </section>`;
  setLCD("Topic", G ? "--" : pad2(t), G ? "Glossary" : `Topic ${t}`);
  G ? setHint("Glossary", "Key terms A–Z", "§ Glossary") : setHint("Topic", topicLabel(t), TOPIC[t].src);
}
function openTopic(n) {
  S.fn.t = n; S.fn.drawer = false;
  renderFN();
  window.scrollTo(0, 0);
  const h = $("#doc-h"); h.tabIndex = -1; h.focus({preventScroll: true});
}
function setDrawer(open) {
  S.fn.drawer = open;
  $("#fn").classList.toggle("drawer-open", open);
  $("#tree-btn").setAttribute("aria-expanded", open);
  if (open) ($("#tree [aria-current]") || $("#tree .folder")).focus();
  else $("#tree-btn").focus();
}

// ---------- events ----------
// re-rendering replaces the buttons; put keyboard focus back on the equivalent control
const refocus = sel => { const el = $(sel); (el && !el.disabled ? el : $("#card")).focus({preventScroll: true}); };
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-act]");
  if (!b) return;
  if (b.dataset.view) return setView(b.dataset.view);
  if (b.id === "card") { if (Date.now() - lastSwipe < 400) return; return flip(); }
  if (b.dataset.jump) { goCard(+b.dataset.jump); return refocus(`[data-jump="${S.fc.i}"]`); }
  if (b.dataset.opt) return answer(+b.dataset.opt);
  if (b.dataset.folder) { const n = +b.dataset.folder; S.qn.open.has(n) ? S.qn.open.delete(n) : S.qn.open.add(n); if (S.qn.all) { S.qn.all = false; S.qn.open = new Set(DATA.topics.map(t => t.n).filter(k => k !== n)); $("#qn-all").setAttribute("aria-pressed", "false"); } paintFolders(); const f = $(`[data-folder="${n}"]`); f && f.focus(); return; }
  if (b.id === "qn-all") { S.qn.all = !S.qn.all; if (!S.qn.all) S.qn.open.clear(); b.setAttribute("aria-pressed", S.qn.all); return paintFolders(); }
  if (b.dataset.topic) return openTopic(+b.dataset.topic);
  if (b.id === "tree-btn") return setDrawer(!S.fn.drawer);
  const act = b.dataset.act;
  if (act === "prev") { goCard(S.fc.i - 1); refocus('[data-act="prev"]'); }
  else if (act === "next") { goCard(S.fc.i + 1); refocus('[data-act="next"]'); }
  else if (act === "flip") flip();
  else if (act === "shuffle") { const F = S.fc; Object.assign(F, {cards: shuffle(F.cards), i: 0, flipped: false, seen: new Set([0])}); renderFC(); say("Cards shuffled. Card 1 of 20"); }
  else if (act === "newset") { newSet(new Set(S.fc.cards.map(c => c.id))); renderFC(); say("New set of 20 cards. Card 1 of 20"); }
  else if (act === "qnext") quizNext();
  else if (act === "newquiz") { newQuiz(); renderQuiz(); window.scrollTo(0, 0); $("#q-title").focus(); }
  else if (act === "closetree") setDrawer(false);
});
document.addEventListener("input", e => { if (e.target.id === "qn-q") { S.qn.q = e.target.value; paintFolders(); } });
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "Escape" && S.view === "fn" && S.fn.drawer) return setDrawer(false);
  if (e.target.closest?.("input,textarea,select")) return;
  if (S.view === "fc") {
    if (e.key === "ArrowRight") { e.preventDefault(); goCard(S.fc.i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goCard(S.fc.i - 1); }
    else if (e.key === " ") {
      const t = e.target.closest?.("button");
      // card and Flip flip natively on Space; Prev/Next and empty focus flip too; other buttons keep their own Space
      if (!t || ["prev", "next"].includes(t.dataset.act)) { e.preventDefault(); if (!e.repeat) flip(); }
    }
  } else if (S.view === "quiz" && S.quiz && !S.quiz.done && S.quiz.ans[S.quiz.i] === undefined) {
    const k = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
    if (k >= 0 && e.key.length === 1) { e.preventDefault(); answer(k); }
  }
});
// buttons activate on Space keyup; stop Prev/Next from also moving the card
document.addEventListener("keyup", e => { if (e.key === " " && S.view === "fc" && ["prev", "next"].includes(e.target.dataset?.act)) e.preventDefault(); });
window.addEventListener("hashchange", () => { const v = HASH[location.hash.slice(1)]; if (v && v !== S.view) setView(v, false); });
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px")).observe($("#hdr"));

// plain text of each quick bullet, for search
DATA.topics.forEach(t => { const d = document.createElement("div"); t.quickText = t.quick.map(h => (d.innerHTML = h, d.textContent)); });
newSet();
setView(HASH[location.hash.slice(1)] || "fc", false);
</script>
