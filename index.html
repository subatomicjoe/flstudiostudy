t plays back a Pattern, an audio file or an automation curve. Types: <strong>Pattern, Audio, Automation<\/strong> (§ 20).<\/li><li><strong>Automation<\/strong>: <strong>recorded or drawn changes to a parameter over time<\/strong>, e.g. a filter slowly opening. Stored as <strong>Event Data<\/strong> or an <strong>Automation Clip<\/strong> (§ 24).<\/li><li><strong>Mixer Insert / Track<\/strong>: a Mixer channel that <strong>receives audio from one or more instruments<\/strong>, with <strong>independent volume, panning and effects<\/strong> (§ 16–19).<\/li><li><strong>Send<\/strong>: <strong>routes audio from one Mixer track to another<\/strong>, typically to <strong>share<\/strong> reverb or delay.<ul><li>In the routing panel, <strong>click the send triangle<\/strong> under a track to enable a send.<\/li><\/ul><\/li><li><strong>Sidechain<\/strong>: <strong>one sound triggers a compressor on another<\/strong>, causing it to <strong>\"duck\"<\/strong>.<ul><li>Classic use: the <strong>kick ducks the bass<\/strong>.<\/li><li>Set the sidechain source in the routing panel, then select it in a compressor (§ 25).<\/li><\/ul><\/li><li><strong>Plugin (Generator vs. Effect)<\/strong>: software that <strong>generates<\/strong> sound (synths, samplers) or <strong>processes<\/strong> sound (EQ, reverb). Managed via the **Plugin Picker (<kbd>F8<\/kbd>)** (§ 26).<\/li><li><strong>Master Track<\/strong>: the <strong>final Mixer track<\/strong> that all other tracks eventually feed into. It is the <strong>overall output<\/strong> of the song. Keep it <strong>below clipping (red)<\/strong>.<\/li><\/ul><div class=\"confuse\"><h3>Common confusions<\/h3><ul><li><strong>Octave<\/strong> = same letter name, double/half frequency. <strong>Semitone<\/strong> = one grid step.<\/li><li><strong>Key<\/strong> = the central note. <strong>Scale<\/strong> = the set of notes. \"C major\" names both.<\/li><li><strong>Melody<\/strong> = single notes in sequence. <strong>Harmony<\/strong> = simultaneous notes that support it. <strong>Chord<\/strong> = 3+ notes together.<\/li><li><strong>Pitch<\/strong> = how high/low. <strong>Timbre<\/strong> = what kind of sound, at the same pitch.<\/li><li><strong>Pattern<\/strong> = the content. <strong>Clip<\/strong> = a block in the Playlist that plays that content.<\/li><li><strong>Send<\/strong> = audio to another track to share an effect. <strong>Sidechain<\/strong> = one sound controls compression on another.<\/li><\/ul><\/div>","quick":["Middle C = <code>C5<\/code> in FL Studio","Semitone = one grid step (<kbd>Shift<\/kbd> + <kbd>↑/↓<\/kbd>); octave = same letter, double/half frequency","Chord = 3+ notes together; melody = single notes in sequence; harmony supports melody","4/4: 4 beats per bar; Step Sequencer = 16 steps/bar = sixteenth notes","Velocity: higher = louder/harder; timbre = a sound's \"colour\"","Pattern = data container; Clip = block in the Playlist","Send shares effects; sidechain makes one sound duck another; Master = final output"]}],"glossary":[["<strong>Apply tempo<\/strong>","Tempo Tapper option: on = sets project BPM, off = only measures","12"],["<strong>Audio Clip<\/strong>","Playlist clip that plays recorded or imported audio","20, 23"],["<strong>Audio Track<\/strong>","Created automatically and linked to a new recording","23"],["<strong>Automation<\/strong>","Recorded or drawn change to a parameter over time","24, 27"],["<strong>Automation Clip<\/strong>","Playlist clip that automates a parameter; made via right-click knob → Create automation clip","20, 24"],["<strong>Bar (measure)<\/strong>","Group of beats, usually 4 in 4/4; 16 steps in the Step Sequencer","27"],["<strong>Bassline Mode<\/strong>","2025 Chord Progression Tool mode that generates a matching bassline","8"],["<strong>Beat<\/strong>","The basic pulse of a piece","27"],["<strong>BPM<\/strong>","Beats per minute, the tempo; shown in the top toolbar","27"],["<strong>Browser<\/strong>","<kbd>Alt/Opt<\/kbd> + <kbd>F8<\/kbd>; single entry point for all media","1, 6"],["<strong>Bypass<\/strong>","Green slot indicator; turns one effect off for A/B comparison","18"],["<strong>Channel<\/strong>","One row in the Channel Rack: an instrument or sample","2"],["<strong>Channel Rack<\/strong>","<kbd>F6<\/kbd>; central hub for all sound sources","1, 2"],["<strong>Chop (Playlist)<\/strong>","Slices Pattern or Automation Clips into smaller pieces","22"],["<strong>Chop chords<\/strong>","<kbd>Alt<\/kbd> + <kbd>U<\/kbd>; turns a held chord into an arpeggiated stream","9"],["<strong>Chord<\/strong>","Three or more notes played together","27"],["<strong>Chord Progression Tool<\/strong>","Generates chord progressions; has Bassline Mode (2025)","8, 27"],["<strong>Clip<\/strong>","Block in the Playlist that plays a Pattern, audio or automation","20, 27"],["<strong>Clip Track<\/strong>","Multi-purpose Playlist track that can hold any clip type","20"],["<strong>Create automation clip<\/strong>","Right-click menu item on any automatable knob","24"],["<strong>Current project<\/strong>","Browser section listing files already used in the project","6"],["<strong>Effect (plugin)<\/strong>","Plugin that processes sound","26"],["<strong>Effect slots<\/strong>","10 per Mixer track; signal flows Slot 1 → 10","18"],["<strong>Event Data / Event Editor<\/strong>","What recorded automation becomes / where you edit it","24"],["<strong>Fill each 2/4/8 step<\/strong>","Auto-fills notes at fixed intervals","11"],["<strong>FL Cloud<\/strong>","Online sample source behind the Sounds tab and Loop Starter","6, 13, 15"],["<strong>FX / TRK field<\/strong>","Field in channel settings that sets the target Mixer Insert","16"],["<strong>Generator<\/strong>","Plugin that produces sound (Sampler, Sytrus, FLEX, VSTi)","26"],["<strong>Ghost Channels<\/strong>","<kbd>Alt<\/kbd> + <kbd>V<\/kbd>; faintly shows other channels' notes","9"],["<strong>Harmony<\/strong>","Simultaneous notes (usually chords) supporting a melody","27"],["<strong>Insert (Channel Rack)<\/strong>","Adds a new instrument channel above the selected one","4"],["<strong>Key<\/strong>","The central note a piece is built around","27"],["<strong>Load Sample<\/strong>","Right-click a Sampler → swap its audio file","3"],["<strong>Loop Starter<\/strong>","2025 genre-based loop templates with FL Cloud access","13"],["<strong>Master Track<\/strong>","Final Mixer track; overall output; keep below red","16, 27"],["<strong>Melody<\/strong>","Sequence of single notes forming the main tune","27"],["<strong>Middle C<\/strong>","<code>C5<\/code> in FL Studio's default naming","27"],["<strong>Mixer<\/strong>","<kbd>F9<\/kbd>; routing, volume balancing, effects","1"],["<strong>Mixer Insert / Track<\/strong>","Mixer channel with its own volume, pan, effects, routing","16, 17, 27"],["<strong>Note<\/strong>","Single sound with pitch, start time, length, velocity","27"],["<strong>Note properties<\/strong>","Right-click a single note → fine-tune pitch etc.","10"],["<strong>Octave<\/strong>","Interval to double/half frequency; same letter name","27"],["<strong>Packs<\/strong>","Stock samples, loops, presets shipped with FL Studio","6, 15"],["<strong>Paint tool<\/strong>","Draws continuous streams of notes (hi-hat rolls)","7"],["<strong>Pattern<\/strong>","Container for notes/automation; can hold multiple channels","21, 27"],["<strong>Pattern Clip<\/strong>","Playlist clip that plays a Pattern","20"],["<strong>Peak meter<\/strong>","Real-time level on a mixer strip; avoid red","19"],["<strong>Piano Roll<\/strong>","<kbd>F7<\/kbd>; melody/chord editor; one per channel","1, 7"],["<strong>Pitch<\/strong>","How high or low a sound is; Piano Roll vertical axis","27"],["<strong>Playlist<\/strong>","<kbd>F5<\/kbd>; song timeline","1, 20"],["<strong>Plugin database<\/strong>","Browser folder linked to the Plugin Picker","6, 26"],["<strong>Plugin Manager<\/strong>","2025: can change a plugin's type after verification","26"],["<strong>Plugin Picker<\/strong>","<kbd>F8<\/kbd>; where you choose and add plugins","26"],["<strong>Record Arm<\/strong>","Circular/disk button at the bottom of a strip; arms the track for recording","19, 23"],["<strong>Replace<\/strong>","Swaps a channel's instrument and keeps notes and pattern data","5"],["<strong>Rhythm<\/strong>","Pattern of sounds in time","27"],["<strong>Riff Machine<\/strong>","<kbd>Alt<\/kbd> + <kbd>E<\/kbd>; generates motifs and variations","9, 11"],["<strong>Route to this track<\/strong>","Right-click channel option after selecting a Mixer Insert","16"],["<strong>Sampler Channel<\/strong>","Auto-created when you drag WAV/MP3 into the Channel Rack","3"],["<strong>Scale<\/strong>","Set of notes forming the tonal basis","27"],["<strong>Scale Highlighting<\/strong>","<code>Helpers &gt; Scale highlighting<\/code>; dims out-of-scale notes","9, 27"],["<strong>Semitone<\/strong>","Smallest interval; one grid step; <kbd>Shift<\/kbd> + <kbd>↑/↓<\/kbd>","10, 27"],["<strong>Send<\/strong>","Routes one Mixer track to another to share an effect","25, 27"],["<strong>Sidechain<\/strong>","One sound triggers a compressor on another so it ducks","25, 27"],["<strong>Slice tool<\/strong>","<kbd>C<\/kbd>; cuts a note in two","7"],["<strong>Slide note<\/strong>","Note that creates a pitch glide; key for 808 basslines","10"],["<strong>Snap<\/strong>","Grid resolution for moving/slicing Playlist clips","22"],["<strong>Song mode<\/strong>","<kbd>L<\/kbd>; plays the whole Playlist arrangement","14, 21"],["<strong>Sounds<\/strong>","Browser tab of FL Cloud samples (edition-dependent)","6, 15"],["<strong>Stamp tool<\/strong>","Hand icon / <kbd>Alt<\/kbd> + <kbd>C<\/kbd>; places a full chord on a root note","8"],["<strong>Step Sequencer<\/strong>","Right side of the Channel Rack; 16 steps per bar","2, 27"],["<strong>Strumize<\/strong>","<kbd>Alt<\/kbd> + <kbd>S<\/kbd>; offsets chord notes into a strum","8"],["<strong>Tempo Tapper<\/strong>","Tap a TAP button in time to estimate BPM","12"],["<strong>Templates<\/strong>","Pre-configured project starting points; File &gt; New from template","13"],["<strong>Timbre<\/strong>","The character/\"colour\" of a sound","27"],["<strong>Turn into automation clip<\/strong>","<code>Edit<\/code> menu command that converts Event Data to a clip","24"],["<strong>Type value<\/strong>","2025 field in the Automation Clip node pop-up for precise values","24"],["<strong>Velocity<\/strong>","How hard a note is played; higher = louder","10, 27"],["<strong>Velocity pane<\/strong>","Bottom of the Piano Roll; vertical bars per note","10"]],"fc":[{"id":"fc-01-1","topic":"1 FL Studio Interface","front":"Which window opens with F5, and what is it for?","back":"The Playlist. It is the song timeline, where you arrange patterns, audio clips and automation.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"fc-01-2","topic":"1 FL Studio Interface","front":"What is the Channel Rack's shortcut, and what do you do there?","back":"F6. You load instruments and samples, and program drums and patterns.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"fc-01-3","topic":"1 FL Studio Interface","front":"Which window does F7 open?","back":"The Piano Roll, where you write melodies, chords and basslines.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"fc-01-4","topic":"1 FL Studio Interface","front":"What does F9 open, and what is it used for?","back":"The Mixer. It is used for routing, volume balancing and effects processing.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"fc-01-5","topic":"1 FL Studio Interface","front":"Your windows are lost or rearranged. Which shortcut resets the layout to default?","back":"Shift + Ctrl + H.","source":"§ 1 FL Studio Interface > Beginner tip"},{"id":"fc-02-1","topic":"2 Channel Rack","front":"What is one row in the Channel Rack?","back":"A Channel: one instrument or sample. The Channel Rack is the central hub for all sound sources.","source":"§ 2 Channel Rack"},{"id":"fc-02-2","topic":"2 Channel Rack","front":"What is the Step Sequencer, and where is it?","back":"It sits on the right side of the Channel Rack and lets you quickly program drum patterns.","source":"§ 2 Channel Rack"},{"id":"fc-02-3","topic":"2 Channel Rack","front":"Name two ways to add an instrument to the Channel Rack.","back":"Click the + button at the bottom, or drag a plugin from the Browser or Plugin Picker into the Channel Rack.","source":"§ 2 Channel Rack > Key operations"},{"id":"fc-02-4","topic":"2 Channel Rack","front":"In the Channel Rack, how do you mute a channel, and how do you solo it?","back":"Click the green light on the left of the channel to mute it. Right-click the light to solo it.","source":"§ 2 Channel Rack > Key operations"},{"id":"fc-03-1","topic":"3 Sampler Channels","front":"What happens when you drag a WAV or MP3 file into the Channel Rack?","back":"FL Studio automatically creates a Sampler Channel for it.","source":"§ 3 Sampler Channels"},{"id":"fc-03-2","topic":"3 Sampler Channels","front":"What kind of audio is a Sampler Channel mainly used for?","back":"Playing one-shot audio, such as drum hits, sound effects and vocal chops.","source":"§ 3 Sampler Channels"},{"id":"fc-03-3","topic":"3 Sampler Channels","front":"How do you replace the audio in a Sampler channel?","back":"Right-click the Sampler channel and choose Load Sample.","source":"§ 3 Sampler Channels > Key operations"},{"id":"fc-03-4","topic":"3 Sampler Channels","front":"Which controls does the Sampler's settings panel offer?","back":"Envelope, looping and pitch controls.","source":"§ 3 Sampler Channels > Key operations"},{"id":"fc-04-1","topic":"4 Insert","front":"What does the Insert command in the Channel Rack do?","back":"It adds a new instrument channel without affecting existing channels.","source":"§ 4 Insert"},{"id":"fc-04-2","topic":"4 Insert","front":"Where does a channel added with Insert appear?","back":"Above the currently selected channel.","source":"§ 4 Insert"},{"id":"fc-04-3","topic":"4 Insert","front":"How do you use Insert?","back":"Right-click any channel button, choose Insert >, then pick an instrument from the list.","source":"§ 4 Insert > How to use"},{"id":"fc-04-4","topic":"4 Insert","front":"The instrument you want isn't in the Insert list. What do you do?","back":"Click More... to open the full plugin picker, then double-click the instrument to add it.","source":"§ 4 Insert > How to use"},{"id":"fc-05-1","topic":"5 Replace","front":"What does Replace do to a channel?","back":"It swaps the channel's instrument for a different one, while keeping all notes and pattern data.","source":"§ 5 Replace"},{"id":"fc-05-2","topic":"5 Replace","front":"How do you use Replace?","back":"Right-click the channel you want to change, choose Replace >, then select the new instrument.","source":"§ 5 Replace > How to use"},{"id":"fc-05-3","topic":"5 Replace","front":"You built a drum pattern with a temporary kick. How do you get a better kick without redrawing the rhythm?","back":"Use Replace on the kick channel. The pattern stays intact.","source":"§ 5 Replace > Typical use case"},{"id":"fc-05-4","topic":"5 Replace","front":"How does Replace help when you've been writing with a placeholder synth?","back":"You can swap the placeholder for your final sound and keep the notes you already wrote.","source":"§ 5 Replace > Typical use case"},{"id":"fc-06-1","topic":"6 Browser Panel","front":"What is the Browser's shortcut, and what is it?","back":"Alt/Opt + F8. It is your single entry point for all media, working like a file explorer for everything FL Studio can use.","source":"§ 6 Browser Panel"},{"id":"fc-06-2","topic":"6 Browser Panel","front":"What is in the Browser's Packs section?","back":"Stock samples, loops and presets that come with FL Studio.","source":"§ 6 Browser Panel > Main sections"},{"id":"fc-06-3","topic":"6 Browser Panel","front":"What does the Browser's Current project section show?","back":"Samples and files already used in the open project.","source":"§ 6 Browser Panel > Main sections"},{"id":"fc-06-4","topic":"6 Browser Panel","front":"Where can you drag items from the Browser?","back":"Into the Channel Rack, the Playlist or the Mixer.","source":"§ 6 Browser Panel > How to use"},{"id":"fc-07-1","topic":"7 Piano Roll","front":"How do you open the Piano Roll for a particular channel?","back":"Right-click the channel and choose Piano roll. Every channel has its own Piano Roll.","source":"§ 7 Piano Roll"},{"id":"fc-07-2","topic":"7 Piano Roll","front":"What is the Paint (brush) tool best for?","back":"Drawing continuous streams of notes, for example hi-hat rolls.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"fc-07-3","topic":"7 Piano Roll","front":"What does the Slice tool (C) do?","back":"It cuts a note into two at the point you click.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"fc-07-4","topic":"7 Piano Roll","front":"How does the Delete (eraser) tool (D) remove notes?","back":"You drag over the notes you want to remove.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"fc-08-1","topic":"8 Chords & Melodies","front":"What does the Stamp tool do?","back":"It places a full chord instantly: choose a chord type from the dropdown, then click a root note.","source":"§ 8 Chords & Melodies > Stamp tool"},{"id":"fc-08-2","topic":"8 Chords & Melodies","front":"How do you open the Stamp tool?","back":"Click the Stamp tool (hand icon) in the Piano Roll toolbar, or press Alt + C.","source":"§ 8 Chords & Melodies > Stamp tool"},{"id":"fc-08-3","topic":"8 Chords & Melodies","front":"What does Strumize (Alt + S) do?","back":"It slightly offsets the notes of a chord to create a natural, guitar-like strum.","source":"§ 8 Chords & Melodies > Strumize"},{"id":"fc-08-4","topic":"8 Chords & Melodies","front":"What is Bassline Mode, new in FL Studio 2025?","back":"A mode in the Chord Progression Tool that generates a matching bassline from your current chord progression.","source":"§ 8 Chords & Melodies > 2025 feature – Bassline Mode"},{"id":"fc-09-1","topic":"9 Piano Roll Tools (Basic)","front":"Where do you turn on Scale Highlighting, and what does it do?","back":"Helpers > Scale highlighting. You choose a key and scale, and notes outside the scale are dimmed.","source":"§ 9 Piano Roll Tools (Basic) > Scale Highlighting"},{"id":"fc-09-2","topic":"9 Piano Roll Tools (Basic)","front":"What do Ghost Channels (Alt + V) show?","back":"Faint notes from other channels while you edit one channel, e.g. chords while you write a bassline.","source":"§ 9 Piano Roll Tools (Basic) > Ghost Channels"},{"id":"fc-09-3","topic":"9 Piano Roll Tools (Basic)","front":"What does Chop chords (Alt + U) do?","back":"It turns a held chord into an arpeggiated stream of notes.","source":"§ 9 Piano Roll Tools (Basic) > Chop chords"},{"id":"fc-09-4","topic":"9 Piano Roll Tools (Basic)","front":"What is the Riff Machine (Alt + E) for?","back":"It generates melodic motifs and variations from your existing progression. It's useful for breaking writer's block.","source":"§ 9 Piano Roll Tools (Basic) > Riff Machine"},{"id":"fc-10-1","topic":"10 Notes","front":"How do you move selected notes up or down by one semitone?","back":"Shift + ↑ or Shift + ↓.","source":"§ 10 Notes > Common operations > Transpose"},{"id":"fc-10-2","topic":"10 Notes","front":"Where do you change note velocity in the Piano Roll?","back":"Select the notes and drag the vertical bars in the velocity pane at the bottom of the Piano Roll.","source":"§ 10 Notes > Common operations > Velocity"},{"id":"fc-10-3","topic":"10 Notes","front":"What does Alt + R do to selected notes, and why use it?","back":"It randomises velocity, which makes drums or keyboards sound more human.","source":"§ 10 Notes > Common operations > Velocity"},{"id":"fc-10-4","topic":"10 Notes","front":"What are slide notes, and what are they essential for?","back":"Notes that create pitch glides. They are FL Studio's signature feature and essential for 808 basslines.","source":"§ 10 Notes > Common operations > Slide notes"},{"id":"fc-11-1","topic":"11 Piano Roll Tools (Advanced / Generative)","front":"What does 'Fill each 2 / 4 / 8 step' do?","back":"It automatically fills notes at fixed intervals, to build steady rhythmic patterns quickly.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"fc-11-2","topic":"11 Piano Roll Tools (Advanced / Generative)","front":"Which examples does the source give for 'Fill each' patterns?","back":"A kick every 4 steps and a snare every 8 steps.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"fc-11-3","topic":"11 Piano Roll Tools (Advanced / Generative)","front":"Where does the source say 'Fill each 2 / 4 / 8 step' is found?","back":"In the Stamp menu or related tools.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"fc-11-4","topic":"11 Piano Roll Tools (Advanced / Generative)","front":"How do you use the Riff Machine at an advanced level?","back":"Adjust its parameters to produce different variations of a motif. It's a fast way to get editable MIDI material.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Riff Machine (advanced use)"},{"id":"fc-12-1","topic":"12 Tempo Tapper","front":"When would you use the Tempo Tapper?","back":"When you have a sample or melody but don't know its BPM.","source":"§ 12 Tempo Tapper"},{"id":"fc-12-2","topic":"12 Tempo Tapper","front":"How do you open the Tempo Tapper?","back":"Right-click the BPM value in the top toolbar and choose Tap, or open it from the View menu.","source":"§ 12 Tempo Tapper > How to use"},{"id":"fc-12-3","topic":"12 Tempo Tapper","front":"How do you measure tempo with the Tempo Tapper?","back":"Play the audio and click the TAP button repeatedly in time with the beat. After several taps, FL Studio estimates the BPM.","source":"§ 12 Tempo Tapper > How to use"},{"id":"fc-12-4","topic":"12 Tempo Tapper","front":"What does the Apply tempo setting control?","back":"When enabled, the project tempo is set to the tapped value. When disabled, it only measures and doesn't change the project.","source":"§ 12 Tempo Tapper > How to use"},{"id":"fc-13-1","topic":"13 Templates","front":"What are templates?","back":"Pre-configured project starting points that save you from repeating the same setup every time.","source":"§ 13 Templates"},{"id":"fc-13-2","topic":"13 Templates","front":"Which menu command starts a project from a template?","back":"File > New from template.","source":"§ 13 Templates > How to use"},{"id":"fc-13-3","topic":"13 Templates","front":"What is Loop Starter (FL Studio 2025)?","back":"Genre-based loop templates that let you start a loop immediately and access FL Cloud samples directly.","source":"§ 13 Templates > 2025 feature – Loop Starter"},{"id":"fc-13-4","topic":"13 Templates","front":"How do you make your own template?","back":"Set up your favourite tracks, routing and effects, then save the project as a template file in FL Studio's Templates folder. It then appears in New from template.","source":"§ 13 Templates > Custom templates"},{"id":"fc-14-1","topic":"14 Make Some Noise","front":"What is the first practical goal in the 'Make Some Noise' exercise?","back":"Build a complete 4-bar loop using the minimal workflow.","source":"§ 14 Make Some Noise"},{"id":"fc-14-2","topic":"14 Make Some Noise","front":"Which three drum sounds does the beginner exercise use, and where are they programmed?","back":"Kick, Clap/Snare and Hi-hat, programmed in the Step Sequencer.","source":"§ 14 Make Some Noise > Step 1: Drums"},{"id":"fc-14-3","topic":"14 Make Some Noise","front":"In the beginner exercise, how should the bassline be drawn?","back":"In the bass channel's Piano Roll, following the root notes.","source":"§ 14 Make Some Noise > Step 2: Bass"},{"id":"fc-14-4","topic":"14 Make Some Noise","front":"Which chain does the 'Make Some Noise' exercise aim to connect?","back":"Channel Rack → Piano Roll → Playlist.","source":"§ 14 Make Some Noise"},{"id":"fc-15-1","topic":"15 Packs and Sounds","front":"What do the Packs contain, and how are they organised?","back":"Drum samples, loops, one-shot effects and presets, organised by style and type.","source":"§ 15 Packs and Sounds"},{"id":"fc-15-2","topic":"15 Packs and Sounds","front":"What does the Sounds tab let you do?","back":"Browse and audition FL Cloud samples and drag them straight into your project, if your edition includes FL Cloud access.","source":"§ 15 Packs and Sounds"},{"id":"fc-15-3","topic":"15 Packs and Sounds","front":"How do you quickly find a sound like an 808 in the Browser?","back":"Type it into the search box at the top of the Browser, e.g. '808', to filter.","source":"§ 15 Packs and Sounds > Browsing tip"},{"id":"fc-15-4","topic":"15 Packs and Sounds","front":"How do you preview a sample in the Browser?","back":"Click it. Whether it plays depends on your preview settings.","source":"§ 15 Packs and Sounds > Browsing tip"},{"id":"fc-16-1","topic":"16 Mixer Track Routing","front":"Where does every Channel Rack instrument output by default?","back":"Directly to the Master track.","source":"§ 16 Mixer Track Routing"},{"id":"fc-16-2","topic":"16 Mixer Track Routing","front":"Which field in the channel settings panel routes a channel to a Mixer Insert?","back":"The FX / TRK field. Type or drag to the target Insert number.","source":"§ 16 Mixer Track Routing > Three common routing methods"},{"id":"fc-16-3","topic":"16 Mixer Track Routing","front":"What is the order of steps for routing with Ctrl + L?","back":"Select the channels in the Channel Rack, click the target Insert in the Mixer, then press Ctrl + L.","source":"§ 16 Mixer Track Routing > Three common routing methods"},{"id":"fc-16-4","topic":"16 Mixer Track Routing","front":"How does 'Route to this track' work?","back":"Select the target Insert on the Mixer, then right-click the channel in the Channel Rack and choose Route to this track.","source":"§ 16 Mixer Track Routing > Three common routing methods"},{"id":"fc-17-1","topic":"17 Mixer Track Options","front":"How do you rename a Mixer track?","back":"Select it and press F2, or right-click the track label and choose Rename.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"fc-17-2","topic":"17 Mixer Track Options","front":"How do you colour-code a Mixer track, and why?","back":"Right-click the track label → Change color. Consistent colours per instrument group help you navigate quickly.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"fc-17-3","topic":"17 Mixer Track Options","front":"How do you solo a Mixer track?","back":"Right-click its green circular mute button. All other tracks mute.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"fc-17-4","topic":"17 Mixer Track Options","front":"Which controls at the top of a Mixer strip set panning and width?","back":"The pan and stereo separation knobs.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"fc-18-1","topic":"18 Effects Rack","front":"How many effect slots does each Mixer track have?","back":"10.","source":"§ 18 Effects Rack"},{"id":"fc-18-2","topic":"18 Effects Rack","front":"In which direction does audio flow through the effect slots?","back":"From Slot 1 to Slot 10, top to bottom.","source":"§ 18 Effects Rack"},{"id":"fc-18-3","topic":"18 Effects Rack","front":"How do you change the order of effects on a track?","back":"Drag the slot labels. The signal flow changes to match.","source":"§ 18 Effects Rack > How to use"},{"id":"fc-18-4","topic":"18 Effects Rack","front":"How do you bypass one effect for an A/B comparison?","back":"Click the green indicator on the left of that slot.","source":"§ 18 Effects Rack > How to use"},{"id":"fc-18-5","topic":"18 Effects Rack","front":"What is the typical order of effects on a track?","back":"EQ → compression → creative effects (saturation, chorus) → time-based effects (delay / reverb).","source":"§ 18 Effects Rack > Typical order"},{"id":"fc-19-1","topic":"19 Mixer Panel Tools","front":"What does the peak meter on a Mixer strip show, and what should you avoid?","back":"The real-time level. Avoid clipping (red).","source":"§ 19 Mixer Panel Tools"},{"id":"fc-19-2","topic":"19 Mixer Panel Tools","front":"What does the volume fader on a Mixer strip do?","back":"It adjusts the track's output level.","source":"§ 19 Mixer Panel Tools"},{"id":"fc-19-3","topic":"19 Mixer Panel Tools","front":"What is the Record Arm button, and where is it?","back":"The circular button (often a disk icon) at the bottom of the strip. It arms the Mixer track as a recording destination.","source":"§ 19 Mixer Panel Tools"},{"id":"fc-19-4","topic":"19 Mixer Panel Tools","front":"List the Mixer strip tools from top to bottom.","back":"Track name, peak meter, pan / stereo separation, volume fader, mute / solo, record arm.","source":"§ 19 Mixer Panel Tools"},{"id":"fc-20-1","topic":"20 Playlist","front":"What are Playlist tracks called, and what can they hold?","back":"Multi-purpose Clip Tracks. They can hold Pattern Clips, Audio Clips and Automation Clips.","source":"§ 20 Playlist"},{"id":"fc-20-2","topic":"20 Playlist","front":"What does a Pattern Clip play?","back":"The content of a Pattern from the Channel Rack (notes, drums).","source":"§ 20 Playlist > Clip types"},{"id":"fc-20-3","topic":"20 Playlist","front":"What does an Audio Clip play?","back":"Recorded or imported audio.","source":"§ 20 Playlist > Clip types"},{"id":"fc-20-4","topic":"20 Playlist","front":"What does an Automation Clip do?","back":"It automates a parameter over time.","source":"§ 20 Playlist > Clip types"},{"id":"fc-21-1","topic":"21 Patterns To Songs","front":"Complete the source's analogy: Patterns are the ___; the Playlist is the ___.","back":"Patterns are the ingredients; the Playlist is the finished dish.","source":"§ 21 Patterns To Songs"},{"id":"fc-21-2","topic":"21 Patterns To Songs","front":"How do you build a song structure from Patterns?","back":"Create Patterns such as Intro, Verse, Chorus and Bridge, then arrange copies of their clips from left to right in the Playlist.","source":"§ 21 Patterns To Songs"},{"id":"fc-21-3","topic":"21 Patterns To Songs","front":"What does pressing L do?","back":"It switches to Song mode, so FL Studio plays all clips in the order they appear in the Playlist.","source":"§ 21 Patterns To Songs"},{"id":"fc-21-4","topic":"21 Patterns To Songs","front":"You edit a Pattern that is used in six places in the Playlist. What happens?","back":"Every clip that references that Pattern updates automatically.","source":"§ 21 Patterns To Songs"},{"id":"fc-22-1","topic":"22 Playlist Tools","front":"What does Chop do in the Playlist?","back":"It slices Pattern or Automation Clips into smaller pieces for rearranging.","source":"§ 22 Playlist Tools > Chop"},{"id":"fc-22-2","topic":"22 Playlist Tools","front":"Where do you find Chop in the Playlist?","back":"In the Clip menu or the right-click menu.","source":"§ 22 Playlist Tools > Chop"},{"id":"fc-22-3","topic":"22 Playlist Tools","front":"What does Snap control in the Playlist?","back":"The grid resolution for moving and slicing clips.","source":"§ 22 Playlist Tools > Snap"},{"id":"fc-22-4","topic":"22 Playlist Tools","front":"What 2025 improvement helps you navigate long songs in the Playlist?","back":"A mini overview added to the horizontal scrollbar.","source":"§ 22 Playlist Tools > 2025 improvement"},{"id":"fc-23-1","topic":"23 Audio Recording","front":"What is the first step to record audio?","back":"Open the Mixer (F9) and select a free Insert Track.","source":"§ 23 Audio Recording > Step 1"},{"id":"fc-23-2","topic":"23 Audio Recording","front":"Where do you set the recording input, and which input does a mono mic usually use?","back":"At the top of the Mixer track (e.g. In 1). A mono microphone usually uses a mono input.","source":"§ 23 Audio Recording > Step 2"},{"id":"fc-23-3","topic":"23 Audio Recording","front":"How do you arm a Mixer track for recording?","back":"Click the record-arm button (circular/disk icon) at the bottom of the track so it lights up.","source":"§ 23 Audio Recording > Step 3"},{"id":"fc-23-4","topic":"23 Audio Recording","front":"What must be ticked in the main Record button's right-click menu to record audio?","back":"Audio.","source":"§ 23 Audio Recording > Step 4"},{"id":"fc-23-5","topic":"23 Audio Recording","front":"After recording audio, what appears in the Playlist?","back":"An Audio Clip, with an Audio Track automatically created and linked to it.","source":"§ 23 Audio Recording > Step 5"},{"id":"fc-24-1","topic":"24 Recording & Editing Automation","front":"How do you set FL Studio to record automation?","back":"Right-click the main Record button and tick Automation.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"fc-24-2","topic":"24 Recording & Editing Automation","front":"What does recording automation by turning a knob create?","back":"Event Data (event automation), which you can edit in the Event Editor.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"fc-24-3","topic":"24 Recording & Editing Automation","front":"How do you convert recorded automation into an Automation Clip?","back":"Edit > Turn into automation clip.","source":"§ 24 Recording & Editing Automation > A. Record automation"},{"id":"fc-24-4","topic":"24 Recording & Editing Automation","front":"How do you create an Automation Clip manually?","back":"Right-click any automatable knob or parameter and choose Create automation clip. It appears in the Playlist.","source":"§ 24 Recording & Editing Automation > B. Create an Automation Clip manually"},{"id":"fc-24-5","topic":"24 Recording & Editing Automation","front":"Which 2025 improvement lets you set exact automation values?","back":"A Type value field in the Automation Clip node pop-up menu.","source":"§ 24 Recording & Editing Automation > B. Create an Automation Clip manually"},{"id":"fc-25-1","topic":"25 Mixing & Effects","front":"What is the aim of mixing?","back":"To make all sounds coexist in volume, frequency and space without masking each other.","source":"§ 25 Mixing & Effects"},{"id":"fc-25-2","topic":"25 Mixing & Effects","front":"Where should volume balancing start?","back":"With the most important element (kick or vocal). Build the other tracks around it and keep the Master meter out of constant red.","source":"§ 25 Mixing & Effects > Core workflow > Volume balance"},{"id":"fc-25-3","topic":"25 Mixing & Effects","front":"What does EQ do in the mix, and which plugin does the source name?","back":"It cuts unwanted low or harsh high frequencies. The plugin is Fruity Parametric EQ 2.","source":"§ 25 Mixing & Effects > Core workflow > Effects processing"},{"id":"fc-25-4","topic":"25 Mixing & Effects","front":"Why use Sends for reverb and delay?","back":"To share one reverb or delay, so multiple sounds sit in the same space.","source":"§ 25 Mixing & Effects > Core workflow > Effects processing"},{"id":"fc-25-5","topic":"25 Mixing & Effects","front":"What does a sidechain do in the source's example?","back":"The kick triggers a compressor on the bass, so the bass ducks when the kick hits.","source":"§ 25 Mixing & Effects > Core workflow > Sidechain"},{"id":"fc-26-1","topic":"26 Plugins","front":"What are the two main categories of plugins?","back":"Generators (instruments), which produce sound, and Effects, which process sound.","source":"§ 26 Plugins"},{"id":"fc-26-2","topic":"26 Plugins","front":"Which window manages plugins, and what is its shortcut?","back":"The Plugin Picker, F8.","source":"§ 26 Plugins"},{"id":"fc-26-3","topic":"26 Plugins","front":"How do you add a plugin to Favorites, and what happens then?","back":"Right-click it in the Plugin Picker and add it to Favorites. It appears at the top of the list, and FL Studio learns your usage habits.","source":"§ 26 Plugins > Management tips"},{"id":"fc-26-4","topic":"26 Plugins","front":"What can the Plugin Manager do in FL Studio 2025?","back":"Change a plugin's type (e.g. Effect to Generator) after verification. Waves VST3 and VST2 entries also merge automatically.","source":"§ 26 Plugins > Management tips > 2025 improvement"},{"id":"fc-27-1","topic":"27 Music Theory & Terminology for FL Studio","front":"How is pitch shown in the Piano Roll?","back":"On the vertical axis: higher notes are placed further up.","source":"§ 27 Music Theory & Terminology for FL Studio > Pitch"},{"id":"fc-27-2","topic":"27 Music Theory & Terminology for FL Studio","front":"What is middle C called in FL Studio's default naming?","back":"C5.","source":"§ 27 Music Theory & Terminology for FL Studio > Pitch"},{"id":"fc-27-3","topic":"27 Music Theory & Terminology for FL Studio","front":"Which four properties does a note in the Piano Roll have?","back":"Pitch (vertical position), start time (horizontal position), length (width) and velocity.","source":"§ 27 Music Theory & Terminology for FL Studio > Note"},{"id":"fc-27-4","topic":"27 Music Theory & Terminology for FL Studio","front":"What is an octave?","back":"The interval to a pitch with double or half the frequency. Notes an octave apart share a letter name, e.g. C4, C5, C6.","source":"§ 27 Music Theory & Terminology for FL Studio > Octave"},{"id":"fc-27-5","topic":"27 Music Theory & Terminology for FL Studio","front":"What is a semitone?","back":"The smallest interval in Western music: one piano key, or one step on the Piano Roll grid.","source":"§ 27 Music Theory & Terminology for FL Studio > Semitone (Half Step)"},{"id":"fc-27-6","topic":"27 Music Theory & Terminology for FL Studio","front":"What is the difference between a key and a scale?","back":"A scale is a set of notes that forms the tonal basis of a piece. The key is the central note the piece is built around (e.g. C major).","source":"§ 27 Music Theory & Terminology for FL Studio > Key"},{"id":"fc-27-7","topic":"27 Music Theory & Terminology for FL Studio","front":"How does harmony differ from melody?","back":"Melody is a sequence of single notes forming the main tune. Harmony is simultaneous notes, usually chords, that support it.","source":"§ 27 Music Theory & Terminology for FL Studio > Harmony"},{"id":"fc-27-8","topic":"27 Music Theory & Terminology for FL Studio","front":"How many steps per bar does the Step Sequencer show by default, and what note value is that?","back":"16 steps, which correspond to sixteenth notes.","source":"§ 27 Music Theory & Terminology for FL Studio > Beat & Bar"},{"id":"fc-27-9","topic":"27 Music Theory & Terminology for FL Studio","front":"What is timbre, and what determines it in FL Studio?","back":"The character or 'colour' of a sound. It is determined by the instrument plugin you choose and its settings.","source":"§ 27 Music Theory & Terminology for FL Studio > Timbre (Tone Colour)"},{"id":"fc-27-10","topic":"27 Music Theory & Terminology for FL Studio","front":"What is the difference between a Pattern and a Clip?","back":"A Pattern is a container for musical data. A Clip is a block in the Playlist that plays back a Pattern, audio or automation.","source":"§ 27 Music Theory & Terminology for FL Studio > Pattern"},{"id":"fc-27-11","topic":"27 Music Theory & Terminology for FL Studio","front":"What is the Master track?","back":"The final Mixer track that all other tracks feed into: the overall output of the song. Keep it below clipping.","source":"§ 27 Music Theory & Terminology for FL Studio > Master Track"},{"id":"fc-27-12","topic":"27 Music Theory & Terminology for FL Studio","front":"What is a Send?","back":"A route from one Mixer track to another, typically to share an effect like reverb or delay across several sounds.","source":"§ 27 Music Theory & Terminology for FL Studio > Send"}],"mcq":[{"id":"mcq-01-1","topic":"1 FL Studio Interface","question":"Which shortcut opens the Mixer?","options":["F9","F8","F7","F5"],"answer":0,"explanation":"F9 opens the Mixer for routing, volume and effects. F8 is tempting, but plain F8 opens the Plugin Picker.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"mcq-01-2","topic":"1 FL Studio Interface","question":"You need to arrange patterns, audio clips and automation along the song timeline. Which window do you open?","options":["Channel Rack (F6)","Playlist (F5)","Piano Roll (F7)","Mixer (F9)"],"answer":1,"explanation":"The Playlist is the song timeline. The Channel Rack holds instruments and patterns, but you don't arrange the song there.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"mcq-01-3","topic":"1 FL Studio Interface","question":"Which shortcut opens the Browser?","options":["F8","F6","Alt/Opt + F8","Alt/Opt + F9"],"answer":2,"explanation":"Alt/Opt + F8 opens the Browser. Plain F8 opens the Plugin Picker instead.","source":"§ 1 FL Studio Interface > Five core windows"},{"id":"mcq-01-4","topic":"1 FL Studio Interface","question":"Your windows are scattered and you want the default layout back. What do you press?","options":["Ctrl + L","Alt + V","Alt + U","Shift + Ctrl + H"],"answer":3,"explanation":"Shift + Ctrl + H resets the window layout. Ctrl + L routes channels to a Mixer Insert and doesn't touch the layout.","source":"§ 1 FL Studio Interface > Beginner tip"},{"id":"mcq-02-1","topic":"2 Channel Rack","question":"What is each row of the Channel Rack?","options":["A Channel: one instrument or sample","A Mixer Insert with its own effects","A Pattern Clip placed on the timeline","An effect slot from the Effects Rack"],"answer":0,"explanation":"Each row is a Channel, one instrument or sample. Mixer Inserts live in the Mixer, not the Channel Rack.","source":"§ 2 Channel Rack"},{"id":"mcq-02-2","topic":"2 Channel Rack","question":"How do you open a channel's detailed settings panel?","options":["Right-click the green light","Left-click the channel name","Right-click and choose Insert >","Right-click and choose Load Sample"],"answer":1,"explanation":"Left-clicking the channel name opens its settings. Right-clicking the green light solos the channel instead.","source":"§ 2 Channel Rack > Key operations"},{"id":"mcq-02-3","topic":"2 Channel Rack","question":"You want to hear only the hi-hat channel. What do you do in the Channel Rack?","options":["Left-click its green light","Left-click its channel name","Right-click its green light","Right-click it and choose Replace >"],"answer":2,"explanation":"Right-clicking the green light solos the channel. A left-click on the light mutes it, the opposite of what you want.","source":"§ 2 Channel Rack > Key operations"},{"id":"mcq-02-4","topic":"2 Channel Rack","question":"Where do you quickly program drum patterns in the Channel Rack?","options":["In the velocity pane at the bottom","In the channel's FX / TRK field","In the Event Editor for the channel","In the Step Sequencer on the right side"],"answer":3,"explanation":"The Step Sequencer on the right of the Channel Rack is for quick drum patterns. The velocity pane is in the Piano Roll and only sets how hard notes play.","source":"§ 2 Channel Rack"},{"id":"mcq-03-1","topic":"3 Sampler Channels","question":"You drag a WAV file into the Channel Rack. What does FL Studio create?","options":["A Sampler Channel","An Audio Clip","An Automation Clip","A Mixer Insert"],"answer":0,"explanation":"Dragging audio into the Channel Rack automatically creates a Sampler Channel. Audio Clips are what appear in the Playlist after recording.","source":"§ 3 Sampler Channels"},{"id":"mcq-03-2","topic":"3 Sampler Channels","question":"How do you swap the audio file inside an existing Sampler channel?","options":["Right-click it and choose Replace >","Right-click it and choose Load Sample","Right-click it and choose Insert >","Right-click it and choose Piano roll"],"answer":1,"explanation":"Load Sample replaces the audio in a Sampler. Replace > swaps the whole instrument, not just the sample.","source":"§ 3 Sampler Channels > Key operations"},{"id":"mcq-03-3","topic":"3 Sampler Channels","question":"You want to play a vocal chop at different pitches. What does the source suggest?","options":["Offset its notes across a chord with Strumize","Show other channels' pitches with Ghost Channels","Play it chromatically from its Piano Roll","Retune it by tapping in the Tempo Tapper"],"answer":2,"explanation":"A Sampler can be played chromatically from its Piano Roll. Strumize only offsets the notes of a chord into a strum.","source":"§ 3 Sampler Channels > Key operations"},{"id":"mcq-03-4","topic":"3 Sampler Channels","question":"Which controls does the Sampler's settings panel offer?","options":["Scale, key and chord type","Input, arm and record filter","Pan, fader and stereo width","Envelope, looping and pitch"],"answer":3,"explanation":"The Sampler panel has envelope, looping and pitch controls. Pan, fader and stereo width belong to a Mixer strip.","source":"§ 3 Sampler Channels > Key operations"},{"id":"mcq-04-1","topic":"4 Insert","question":"What does Insert do in the Channel Rack?","options":["Adds a new instrument channel above the selected one","Swaps the selected channel's instrument but keeps its notes","Routes the selected channel to the chosen Mixer Insert","Loads a new audio file into the selected Sampler"],"answer":0,"explanation":"Insert adds a new channel above the selected one and leaves existing channels alone. Swapping the instrument while keeping notes is Replace.","source":"§ 4 Insert"},{"id":"mcq-04-2","topic":"4 Insert","question":"Where does a channel created with Insert appear?","options":["At the bottom of the Channel Rack","Above the currently selected channel","Below the currently selected channel","On a new Mixer Insert track"],"answer":1,"explanation":"The source says Insert adds the channel above the selected one. It doesn't go below it or to the bottom of the rack.","source":"§ 4 Insert"},{"id":"mcq-04-3","topic":"4 Insert","question":"The instrument you want isn't in the Insert > list. What do you click?","options":["Load Sample","Route to this track","More...","Create automation clip"],"answer":2,"explanation":"More... opens the full plugin picker, where you double-click to add. Load Sample only loads audio into a Sampler.","source":"§ 4 Insert > How to use"},{"id":"mcq-04-4","topic":"4 Insert","question":"Your channels are all set up and you want one more synth without touching them. Which command fits?","options":["Replace >","Load Sample","Route to this track","Insert >"],"answer":3,"explanation":"Insert adds a channel without affecting existing ones. Replace would change an existing channel's instrument.","source":"§ 4 Insert"},{"id":"mcq-05-1","topic":"5 Replace","question":"What does Replace keep when it swaps a channel's instrument?","options":["All notes and pattern data","The old instrument's settings","The channel's audio file only","Nothing; the channel is cleared"],"answer":0,"explanation":"Replace keeps all notes and pattern data. The old instrument is what gets swapped out.","source":"§ 5 Replace"},{"id":"mcq-05-2","topic":"5 Replace","question":"Which statement about Replace is true?","options":["It adds a channel above the selected one","It changes an existing channel","It moves the channel to a new Insert","It deletes the pattern so you redraw it"],"answer":1,"explanation":"Replace works on an existing channel and keeps its notes. Adding a channel above the selected one is Insert.","source":"§ 5 Replace"},{"id":"mcq-05-3","topic":"5 Replace","question":"You wrote a melody with a placeholder synth and want your final synth to play the same notes. What do you do?","options":["Right-click the channel → Insert > the new synth","Right-click the channel → Load Sample with the synth","Right-click the channel → Replace > the new synth","Drag the new synth from the Browser into the Rack"],"answer":2,"explanation":"Replace swaps the instrument and keeps all notes and pattern data. Insert would add a new, empty channel above the selected one.","source":"§ 5 Replace > How to use"},{"id":"mcq-05-4","topic":"5 Replace","question":"You programmed a drum pattern with a temporary kick and found a better kick. What does the source recommend to avoid redrawing the rhythm?","options":["Insert a new channel above the kick","Chop the pattern clip in the Playlist","Draw the rhythm again with Paint","Replace the kick channel's instrument"],"answer":3,"explanation":"The source's use case is to Replace the temporary kick, so the rhythm stays. Insert would create a new empty channel you'd have to program again.","source":"§ 5 Replace > Typical use case"},{"id":"mcq-06-1","topic":"6 Browser Panel","question":"How does the source describe the Browser?","options":["A single entry point for all media","The song timeline for all clips","The hub for routing and effects","The editor for melodies and chords"],"answer":0,"explanation":"The Browser works like a file explorer for all media. The song timeline is the Playlist.","source":"§ 6 Browser Panel"},{"id":"mcq-06-2","topic":"6 Browser Panel","question":"Which Browser section holds the stock samples, loops and presets that come with FL Studio?","options":["Sounds","Packs","Plugin database","Current project"],"answer":1,"explanation":"Packs is the stock content. Sounds is extra FL Cloud content that depends on your edition.","source":"§ 6 Browser Panel > Main sections"},{"id":"mcq-06-3","topic":"6 Browser Panel","question":"Which Browser section lists all installed instruments and effects by category?","options":["Packs","Current project","Plugin database","Sounds"],"answer":2,"explanation":"The Plugin database lists installed plugins by category and is linked to the Plugin Picker. Packs holds samples and presets, not installed plugins.","source":"§ 6 Browser Panel > Main sections"},{"id":"mcq-06-4","topic":"6 Browser Panel","question":"Where can you drag an item from the Browser?","options":["Only into the Channel Rack","Only into the Playlist","Only into the Plugin Picker","Channel Rack, Playlist or Mixer"],"answer":3,"explanation":"The source says you can drag from the Browser into the Channel Rack, the Playlist or the Mixer. It isn't limited to the Channel Rack.","source":"§ 6 Browser Panel > How to use"},{"id":"mcq-07-1","topic":"7 Piano Roll","question":"Which shortcut opens the Piano Roll window?","options":["F7","F6","F5","F9"],"answer":0,"explanation":"F7 opens the Piano Roll. F6 is the Channel Rack, where you pick the channel whose notes you edit.","source":"§ 7 Piano Roll"},{"id":"mcq-07-2","topic":"7 Piano Roll","question":"You want a fast hi-hat roll as one continuous stream of notes. Which tool is described for this?","options":["Slice","Paint (brush)","Select","Delete (eraser)"],"answer":1,"explanation":"Paint draws continuous streams of notes, great for hi-hat rolls. Slice cuts one note into two instead.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"mcq-07-3","topic":"7 Piano Roll","question":"What does the Slice tool (C) do in the Piano Roll?","options":["Removes every note you drag across","Box-selects notes for batch edits","Cuts a note into two at the clicked point","Slices clips in the Playlist into pieces"],"answer":2,"explanation":"Slice cuts one note in two. Slicing clips in the Playlist is the separate Chop command.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"mcq-07-4","topic":"7 Piano Roll","question":"Which tool and shortcut do you use to box-select notes for a batch edit?","options":["Slice (C)","Delete (D)","Stamp (Alt + C)","Select (E)"],"answer":3,"explanation":"Select (E) box-selects or click-selects notes for batch edits. Delete (D) removes the notes you drag over.","source":"§ 7 Piano Roll > Essential tool shortcuts"},{"id":"mcq-08-1","topic":"8 Chords & Melodies","question":"How do you place a full chord instantly in the Piano Roll?","options":["Stamp tool: pick a chord type, click a root","Strumize: offset a chord's notes into a strum","Chop chords: turn a chord into a stream","Riff Machine: generate motif variations"],"answer":0,"explanation":"The Stamp tool places a whole chord at the root note you click. Strumize only offsets the notes of an existing chord.","source":"§ 8 Chords & Melodies > Stamp tool"},{"id":"mcq-08-2","topic":"8 Chords & Melodies","question":"What is the shortcut for Strumize?","options":["Alt + C","Alt + S","Alt + U","Alt + E"],"answer":1,"explanation":"Alt + S is Strumize. Alt + C opens the Stamp tool.","source":"§ 8 Chords & Melodies > Strumize"},{"id":"mcq-08-3","topic":"8 Chords & Melodies","question":"Your stamped chord sounds stiff and you want a guitar-like strum. What do you use?","options":["Chop chords","Scale highlighting","Strumize","Ghost Channels"],"answer":2,"explanation":"Strumize slightly offsets the chord's notes for a natural strum. Chop chords turns the chord into an arpeggiated stream, which is a different effect.","source":"§ 8 Chords & Melodies > Strumize"},{"id":"mcq-08-4","topic":"8 Chords & Melodies","question":"Which 2025 feature generates a bassline that matches your chord progression?","options":["Fill each 2 / 4 / 8 step in the Stamp menu","The Riff Machine (Alt + E) variations","Loop Starter genre-based templates","Bassline Mode (Chord Progression Tool)"],"answer":3,"explanation":"Bassline Mode in the Chord Progression Tool builds a matching bassline. The Riff Machine generates melodic motifs, not a bassline from your chords.","source":"§ 8 Chords & Melodies > 2025 feature – Bassline Mode"},{"id":"mcq-09-1","topic":"9 Piano Roll Tools (Basic)","question":"Where do you turn on Scale Highlighting?","options":["Helpers > Scale highlighting","Edit > Turn into automation clip","File > New from template","View menu > Tempo Tapper"],"answer":0,"explanation":"Scale highlighting is in the Helpers menu. Edit > Turn into automation clip converts recorded automation instead.","source":"§ 9 Piano Roll Tools (Basic) > Scale Highlighting"},{"id":"mcq-09-2","topic":"9 Piano Roll Tools (Basic)","question":"You're writing a bassline and want to see another channel's chord notes faintly. What do you turn on?","options":["Scale highlighting (Helpers)","Ghost Channels (Alt + V)","Chop chords (Alt + U)","Riff Machine (Alt + E)"],"answer":1,"explanation":"Ghost Channels faintly shows notes from other channels. Scale highlighting dims out-of-scale notes but doesn't show other channels.","source":"§ 9 Piano Roll Tools (Basic) > Ghost Channels"},{"id":"mcq-09-3","topic":"9 Piano Roll Tools (Basic)","question":"What does Chop chords (Alt + U) do?","options":["Offsets chord notes into a guitar-like strum","Places a full chord at the clicked root note","Turns a held chord into an arpeggiated stream","Slices a Playlist clip into smaller pieces"],"answer":2,"explanation":"Chop chords arpeggiates a held chord. Offsetting chord notes into a strum is Strumize.","source":"§ 9 Piano Roll Tools (Basic) > Chop chords"},{"id":"mcq-09-4","topic":"9 Piano Roll Tools (Basic)","question":"You're stuck for melody ideas over your progression. Which helper generates motifs and variations?","options":["Ghost Channels","Scale highlighting","Tempo Tapper","Riff Machine"],"answer":3,"explanation":"The Riff Machine generates motifs and variations, which helps with writer's block. Ghost Channels only shows other channels' notes.","source":"§ 9 Piano Roll Tools (Basic) > Riff Machine"},{"id":"mcq-10-1","topic":"10 Notes","question":"How do you transpose selected notes by one semitone?","options":["Shift + ↑/↓","Alt + R","Alt + U","Ctrl + L"],"answer":0,"explanation":"Shift + arrow moves notes by a semitone. Alt + R randomises velocity and doesn't change pitch.","source":"§ 10 Notes > Common operations > Transpose"},{"id":"mcq-10-2","topic":"10 Notes","question":"Where in the Piano Roll do you adjust how hard notes are played?","options":["The Scale highlighting menu","The velocity pane at the bottom","The channel's FX / TRK field","The Stamp tool dropdown"],"answer":1,"explanation":"Velocity is set by dragging bars in the velocity pane at the bottom of the Piano Roll. The FX / TRK field routes a channel to the Mixer.","source":"§ 10 Notes > Common operations > Velocity"},{"id":"mcq-10-3","topic":"10 Notes","question":"Your programmed keyboard part sounds robotic. Which shortcut does the source suggest to humanise it?","options":["Alt + S","Alt + V","Alt + R","Alt + E"],"answer":2,"explanation":"Alt + R randomises velocity for a more human feel. Alt + S is Strumize, which offsets chord notes in time rather than velocity.","source":"§ 10 Notes > Common operations > Velocity"},{"id":"mcq-10-4","topic":"10 Notes","question":"You want an 808 bassline that glides between pitches. What do you use?","options":["Chop chords","Strumize","Velocity randomising","Slide notes"],"answer":3,"explanation":"Slide notes create pitch glides and are essential for 808 basslines. Strumize only offsets the notes of a chord.","source":"§ 10 Notes > Common operations > Slide notes"},{"id":"mcq-11-1","topic":"11 Piano Roll Tools (Advanced / Generative)","question":"What does 'Fill each 2 / 4 / 8 step' do?","options":["Fills notes at fixed intervals for steady rhythms","Offsets chord notes for a natural, strummed feel","Generates melodic motifs from a progression","Turns a held chord into an arpeggiated stream"],"answer":0,"explanation":"Fill each places notes automatically at fixed intervals. Generating melodic motifs is the Riff Machine's job.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"mcq-11-2","topic":"11 Piano Roll Tools (Advanced / Generative)","question":"You want a kick on every 4th step without placing each one by hand. Which tool fits?","options":["Paint (brush) tool","Fill each 4 steps","Chop chords","Riff Machine"],"answer":1,"explanation":"Fill each places notes at fixed intervals, like a kick every 4 steps. Paint draws continuous streams of notes, not notes at a set interval.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"mcq-11-3","topic":"11 Piano Roll Tools (Advanced / Generative)","question":"Where does the source say the 'Fill each' options are?","options":["In the Helpers menu with Scale highlighting","In the Playlist's Clip menu with Chop","In the Stamp menu or related tools","In the Mixer's routing panel"],"answer":2,"explanation":"The source places 'Fill each' in the Stamp menu or related tools. The Helpers menu is where Scale highlighting lives.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Fill each 2 / 4 / 8 step"},{"id":"mcq-11-4","topic":"11 Piano Roll Tools (Advanced / Generative)","question":"Beyond basic melody generation, how is the Riff Machine used at an advanced level?","options":["Draw its control points in the Playlist","Route its output with Ctrl + L","Tap its tempo with the TAP button","Adjust its parameters to vary a motif"],"answer":3,"explanation":"Adjusting Riff Machine parameters gives different variations of a motif as editable MIDI. Control points are drawn on Automation Clips, not the Riff Machine.","source":"§ 11 Piano Roll Tools (Advanced / Generative) > Riff Machine (advanced use)"},{"id":"mcq-12-1","topic":"12 Tempo Tapper","question":"When is the Tempo Tapper useful?","options":["When you don't know a sample's BPM","When you need to reset the window layout","When you want to strum a chord","When a track's meter is clipping"],"answer":0,"explanation":"The Tempo Tapper measures the BPM of a sample or melody you don't know. Resetting the layout is Shift + Ctrl + H.","source":"§ 12 Tempo Tapper"},{"id":"mcq-12-2","topic":"12 Tempo Tapper","question":"How do you open the Tempo Tapper from the toolbar?","options":["Right-click the main Record button","Right-click the BPM value and choose Tap","Left-click the channel name","Right-click an empty plugin slot"],"answer":1,"explanation":"Right-click the BPM value and choose Tap, or use the View menu. Right-clicking the main Record button opens the recording filter instead.","source":"§ 12 Tempo Tapper > How to use"},{"id":"mcq-12-3","topic":"12 Tempo Tapper","question":"You want to check a loop's tempo without changing your project's BPM. What do you do?","options":["Turn Apply tempo on","Turn Snap off","Turn Apply tempo off","Untick Audio in the Record menu"],"answer":2,"explanation":"With Apply tempo disabled, the Tapper only measures. With it enabled, the project tempo is set to the tapped value.","source":"§ 12 Tempo Tapper > How to use"},{"id":"mcq-12-4","topic":"12 Tempo Tapper","question":"How does the Tempo Tapper work out the BPM?","options":["It reads the sample's name in the Browser","It reads the tempo from the Playlist","It counts steps in the Step Sequencer","You click TAP in time with the beat"],"answer":3,"explanation":"You click TAP repeatedly in time with the beat, and after several taps FL Studio estimates the BPM. It doesn't read the tempo from anywhere.","source":"§ 12 Tempo Tapper > How to use"},{"id":"mcq-13-1","topic":"13 Templates","question":"What are templates in FL Studio?","options":["Pre-configured project starting points","Genre presets for the Riff Machine","Saved chord types for the Stamp tool","Stock samples in the Packs folder"],"answer":0,"explanation":"Templates are pre-configured starting points for a project. Saved chord types belong to the Stamp tool's dropdown, not templates.","source":"§ 13 Templates"},{"id":"mcq-13-2","topic":"13 Templates","question":"How do you open a template?","options":["Right-click the BPM value > Tap","File > New from template","Right-click a channel > Insert >","Right-click Record > Automation"],"answer":1,"explanation":"File > New from template lists the templates. Right-click a channel > Insert > adds an instrument channel instead.","source":"§ 13 Templates > How to use"},{"id":"mcq-13-3","topic":"13 Templates","question":"What does Loop Starter (FL Studio 2025) offer?","options":["A bassline that follows your chord progression","A mini overview on the Playlist scrollbar","Genre-based loop templates with FL Cloud samples","A Type value field for automation nodes"],"answer":2,"explanation":"Loop Starter gives genre-based loop templates with direct FL Cloud access. A bassline from your chords is Bassline Mode, a different 2025 feature.","source":"§ 13 Templates > 2025 feature – Loop Starter"},{"id":"mcq-13-4","topic":"13 Templates","question":"You want every new project to open with your usual tracks, routing and effects. What do you do?","options":["Add your plugins to the Plugin Picker Favorites","Save the patterns in the Current project section","Turn on Loop Starter in New from template","Save it as a template in the Templates folder"],"answer":3,"explanation":"Save the configured project as a template file in the Templates folder, and it appears in New from template. Favorites only reorder the Plugin Picker.","source":"§ 13 Templates > Custom templates"},{"id":"mcq-14-1","topic":"14 Make Some Noise","question":"What is the goal of the 'Make Some Noise' exercise?","options":["A complete 4-bar loop","A fully mixed song","A recorded vocal take","A custom project template"],"answer":0,"explanation":"The first practical goal is a complete 4-bar loop, not perfection. Mixing comes later in the learning path.","source":"§ 14 Make Some Noise"},{"id":"mcq-14-2","topic":"14 Make Some Noise","question":"In the beginner loop, where do you click in the Kick, Clap/Snare and Hi-hat rhythm?","options":["Event Editor","Step Sequencer","Mixer routing panel","Plugin Picker"],"answer":1,"explanation":"The drums are programmed in the Step Sequencer. The Event Editor is for editing recorded automation.","source":"§ 14 Make Some Noise > Step 1: Drums"},{"id":"mcq-14-3","topic":"14 Make Some Noise","question":"In the exercise, what should the first bassline follow?","options":["The hi-hat pattern","The velocity pane","The root notes","The Master meter"],"answer":2,"explanation":"The exercise draws the bassline following the root notes. The hi-hat pattern is part of the drums, not the bass.","source":"§ 14 Make Some Noise > Step 2: Bass"},{"id":"mcq-14-4","topic":"14 Make Some Noise","question":"Which chain does the exercise aim to connect?","options":["Browser → Plugin Picker → Mixer","Playlist → Mixer → Master track","Piano Roll → Event Editor → Playlist","Channel Rack → Piano Roll → Playlist"],"answer":3,"explanation":"The goal is to connect Channel Rack → Piano Roll → Playlist. The Mixer and Master come in later topics.","source":"§ 14 Make Some Noise"},{"id":"mcq-15-1","topic":"15 Packs and Sounds","question":"How are the Packs organised?","options":["By style and type","By plugin category","By project usage","By FL Cloud edition"],"answer":0,"explanation":"Packs are organised by style and type. Organising by category is how the Plugin database works.","source":"§ 15 Packs and Sounds"},{"id":"mcq-15-2","topic":"15 Packs and Sounds","question":"What does the Sounds tab depend on?","options":["Whether Apply tempo is enabled","Whether your edition includes FL Cloud","Whether the track is record-armed","Whether Scale highlighting is on"],"answer":1,"explanation":"The Sounds tab is available if your edition includes FL Cloud access. Apply tempo is a Tempo Tapper setting.","source":"§ 15 Packs and Sounds"},{"id":"mcq-15-3","topic":"15 Packs and Sounds","question":"You need a riser effect fast. What does the source suggest?","options":["Open the Riff Machine and pick a riser","Create an automation clip named riser","Type 'riser' in the Browser search box","Look in the Event Editor for risers"],"answer":2,"explanation":"The Browser's search box filters quickly, with 'riser' as one of the source's examples. The Riff Machine generates melodic motifs, not sound effects.","source":"§ 15 Packs and Sounds > Browsing tip"},{"id":"mcq-15-4","topic":"15 Packs and Sounds","question":"Which kinds of content are in the Packs?","options":["Installed instruments and effects by category","Samples and files already used in this project","Genre-based loop templates for new projects","Drum samples, loops, one-shots and presets"],"answer":3,"explanation":"Packs hold stock drum samples, loops, one-shot effects and presets. Installed instruments and effects are listed in the Plugin database.","source":"§ 15 Packs and Sounds"},{"id":"mcq-16-1","topic":"16 Mixer Track Routing","question":"Where does a new Channel Rack instrument send its audio by default?","options":["Directly to the Master track","To the next free Mixer Insert","To the Insert you last selected","To a Send track for reverb"],"answer":0,"explanation":"By default every instrument outputs straight to the Master. You must route it to its own Insert yourself.","source":"§ 16 Mixer Track Routing"},{"id":"mcq-16-2","topic":"16 Mixer Track Routing","question":"You selected three channels in the Channel Rack and clicked Insert 5 in the Mixer. What do you press to route them?","options":["Alt + V","Ctrl + L","F2","Shift + Ctrl + H"],"answer":1,"explanation":"Ctrl + L routes the selected channels to the selected Insert. F2 renames a Mixer track.","source":"§ 16 Mixer Track Routing > Three common routing methods"},{"id":"mcq-16-3","topic":"16 Mixer Track Routing","question":"In a channel's settings panel, which field sets its Mixer Insert?","options":["Type value","Apply tempo","FX / TRK","Snap"],"answer":2,"explanation":"Type or drag the Insert number in the FX / TRK field. Type value is a field in Automation Clip nodes.","source":"§ 16 Mixer Track Routing > Three common routing methods"},{"id":"mcq-16-4","topic":"16 Mixer Track Routing","question":"Which channels does the source say to route to separate Inserts, at minimum?","options":["Only the kick and the bass","Only vocals and recorded audio","Every channel to one shared Insert","Kick, snare, hi-hat, bass, melody, vocals"],"answer":3,"explanation":"For a clean mix, route at least kick, snare, hi-hat, bass, melody and vocals separately. Kick and bass alone isn't enough.","source":"§ 16 Mixer Track Routing > 2025 note"},{"id":"mcq-17-1","topic":"17 Mixer Track Options","question":"How do you rename a selected Mixer track with the keyboard?","options":["F2","F5","F8","F9"],"answer":0,"explanation":"F2 renames the selected track. F9 opens the Mixer itself.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"mcq-17-2","topic":"17 Mixer Track Options","question":"What happens when you right-click a Mixer track's green mute button?","options":["That track is muted on its own","That track solos and the others mute","The track is armed for recording","The track's effects are bypassed"],"answer":1,"explanation":"Right-clicking the mute button solos the track and mutes all others. A normal click mutes the track.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"mcq-17-3","topic":"17 Mixer Track Options","question":"Why colour-code Mixer tracks by instrument group?","options":["To route them to the Master","To set their stereo width","To navigate the Mixer quickly","To arm them for recording"],"answer":2,"explanation":"Consistent colours per group help you find tracks quickly. Colour has no effect on routing.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"mcq-17-4","topic":"17 Mixer Track Options","question":"Which controls at the top of a Mixer strip set panning and stereo width?","options":["The volume fader and peak meter","The record arm and input select","The effect slots and bypass lights","Pan and stereo separation knobs"],"answer":3,"explanation":"The knobs at the top of the strip set pan and stereo width. The input selector is also at the top, but it chooses the recording input.","source":"§ 17 Mixer Track Options > Common track options"},{"id":"mcq-18-1","topic":"18 Effects Rack","question":"How many effect slots does a Mixer track have?","options":["10","8","16","4"],"answer":0,"explanation":"Each Mixer track has 10 effect slots. 16 is the number of Step Sequencer steps per bar, not effect slots.","source":"§ 18 Effects Rack"},{"id":"mcq-18-2","topic":"18 Effects Rack","question":"In what order does audio pass through a track's effect slots?","options":["Slot 10 to Slot 1, bottom to top","Slot 1 to Slot 10, top to bottom","All slots at once, in parallel","Only the slot you last opened"],"answer":1,"explanation":"Audio flows from Slot 1 to Slot 10, top to bottom, which is why order matters. It is not processed in parallel.","source":"§ 18 Effects Rack"},{"id":"mcq-18-3","topic":"18 Effects Rack","question":"You want reverb to come after compression on a track. How do you reorder the effects?","options":["Right-click a slot and choose Replace >","Click the green indicator on a slot","Drag the slot labels into order","Route the track again with Ctrl + L"],"answer":2,"explanation":"Dragging slot labels reorders effects and changes the signal flow. The green indicator only bypasses an effect.","source":"§ 18 Effects Rack > How to use"},{"id":"mcq-18-4","topic":"18 Effects Rack","question":"Which is the typical effects order the source gives?","options":["Reverb, delay, compression, then EQ","Compression, reverb, EQ, then saturation","Creative, EQ, reverb, then compression","EQ, compression, creative, then delay/reverb"],"answer":3,"explanation":"EQ fixes problems first, then compression, then creative effects, with time-based delay and reverb last. Putting reverb first reverses the recommended order.","source":"§ 18 Effects Rack > Typical order"},{"id":"mcq-19-1","topic":"19 Mixer Panel Tools","question":"On a Mixer strip, which element shows the real-time level?","options":["Peak meter","Volume fader","Record Arm","Track name"],"answer":0,"explanation":"The peak meter shows the real-time level. The volume fader sets the output level; it doesn't display it.","source":"§ 19 Mixer Panel Tools"},{"id":"mcq-19-2","topic":"19 Mixer Panel Tools","question":"What does the Record Arm button on a Mixer track do?","options":["Ticks Audio in the main record filter","Arms the track as a recording destination","Creates an Automation Clip for the fader","Solos the track and mutes all others"],"answer":1,"explanation":"Record Arm makes that Mixer track a recording destination. Ticking Audio is done separately, in the main Record button's right-click menu.","source":"§ 19 Mixer Panel Tools"},{"id":"mcq-19-3","topic":"19 Mixer Panel Tools","question":"Where is the Record Arm button on a Mixer strip?","options":["At the top, above the name","Next to the pan knob","At the bottom of the strip","Inside effect slot 1"],"answer":2,"explanation":"Record Arm is the circular (disk) button at the bottom of the strip. The track name sits at the top.","source":"§ 19 Mixer Panel Tools"},{"id":"mcq-19-4","topic":"19 Mixer Panel Tools","question":"Your peak meter keeps hitting red. What does that mean?","options":["The track is soloed","The track is record-armed","The effect is bypassed","The track is clipping"],"answer":3,"explanation":"Red on the peak meter means clipping, which you should avoid. Soloing is shown by the mute/solo button, not the meter.","source":"§ 19 Mixer Panel Tools"},{"id":"mcq-20-1","topic":"20 Playlist","question":"What are the Playlist's tracks called?","options":["Multi-purpose Clip Tracks","Mixer Insert tracks","Step Sequencer rows","Dedicated Audio Tracks"],"answer":0,"explanation":"Playlist tracks are multi-purpose Clip Tracks that can hold any clip type. Mixer Inserts are in the Mixer.","source":"§ 20 Playlist"},{"id":"mcq-20-2","topic":"20 Playlist","question":"Which clip type plays a Pattern from the Channel Rack?","options":["Audio Clip","Pattern Clip","Automation Clip","Sampler Channel"],"answer":1,"explanation":"A Pattern Clip plays a Pattern's notes and drums. A Sampler Channel is a Channel Rack instrument, not a Playlist clip.","source":"§ 20 Playlist > Clip types"},{"id":"mcq-20-3","topic":"20 Playlist","question":"You import a recorded vocal into the Playlist. Which clip type holds it?","options":["Pattern Clip","Automation Clip","Audio Clip","Event Data"],"answer":2,"explanation":"Audio Clips play recorded or imported audio. Pattern Clips play note data from a Pattern.","source":"§ 20 Playlist > Clip types"},{"id":"mcq-20-4","topic":"20 Playlist","question":"Which statement about Playlist tracks is true?","options":["Each track holds one clip type only","Tracks hold Pattern Clips only","Audio needs a separate Mixer view","Any track can hold any clip type"],"answer":3,"explanation":"Playlist tracks are multi-purpose: Pattern, Audio and Automation Clips can sit on any of them. They are not limited to one type.","source":"§ 20 Playlist"},{"id":"mcq-21-1","topic":"21 Patterns To Songs","question":"Which analogy does the source use for Patterns and the Playlist?","options":["Ingredients and the finished dish","Notes and the velocity pane","Channels and the Master track","Slots and the Effects Rack"],"answer":0,"explanation":"Patterns are the ingredients and the Playlist is the finished dish. Channels and the Master describe the Mixer's routing, not song building.","source":"§ 21 Patterns To Songs"},{"id":"mcq-21-2","topic":"21 Patterns To Songs","question":"What does pressing L do?","options":["Opens the Piano Roll","Switches to Song mode","Randomises velocity","Routes to an Insert"],"answer":1,"explanation":"L switches to Song mode, which plays the Playlist arrangement. Routing to an Insert is Ctrl + L, not L on its own.","source":"§ 21 Patterns To Songs"},{"id":"mcq-21-3","topic":"21 Patterns To Songs","question":"You change the notes in your Chorus Pattern, which appears four times in the Playlist. What happens?","options":["Only the first clip updates","Only the clip you clicked updates","All four clips update automatically","The clips turn into Audio Clips"],"answer":2,"explanation":"Every clip referencing a Pattern updates when you edit it. It isn't only the clip you clicked.","source":"§ 21 Patterns To Songs"},{"id":"mcq-21-4","topic":"21 Patterns To Songs","question":"In Song mode, in what order do clips play?","options":["The order the Patterns were created","Alphabetical order by Pattern name","The order of the Channel Rack rows","The order they appear in the Playlist"],"answer":3,"explanation":"Song mode plays clips in the order they appear in the Playlist, left to right. Creation order doesn't matter.","source":"§ 21 Patterns To Songs"},{"id":"mcq-22-1","topic":"22 Playlist Tools","question":"Which clip types can Chop slice in the Playlist?","options":["Pattern and Automation Clips","Audio Clips only","Sampler Channels","Mixer Inserts"],"answer":0,"explanation":"The source says Chop slices Pattern or Automation Clips. It doesn't say Chop works on Audio Clips.","source":"§ 22 Playlist Tools > Chop"},{"id":"mcq-22-2","topic":"22 Playlist Tools","question":"What does Snap control in the Playlist?","options":["The level at which a meter starts clipping","Grid resolution for moving and slicing clips","The order in which effects are processed","The tempo set by the Tempo Tapper"],"answer":1,"explanation":"Snap sets the grid resolution for moving and slicing clips. It doesn't cut anything by itself.","source":"§ 22 Playlist Tools > Snap"},{"id":"mcq-22-3","topic":"22 Playlist Tools","question":"You want to box-select several clips in the Playlist to move them. Which tool do you use?","options":["Chop","Snap","Select tool (E)","Mini overview"],"answer":2,"explanation":"The Select tool (E) box-selects and moves clips. Chop slices clips rather than selecting them.","source":"§ 22 Playlist Tools > Select tool"},{"id":"mcq-22-4","topic":"22 Playlist Tools","question":"Which 2025 improvement was added to the Playlist's horizontal scrollbar?","options":["A Type value field","A Bassline Mode","A Loop Starter","A mini overview"],"answer":3,"explanation":"A mini overview on the scrollbar helps you navigate long songs. Type value is the 2025 Automation Clip improvement.","source":"§ 22 Playlist Tools > 2025 improvement"},{"id":"mcq-23-1","topic":"23 Audio Recording","question":"What is the first step in recording vocals?","options":["Open the Mixer and select a free Insert","Open the Piano Roll and draw the notes","Open the Browser and load a pack","Open the Plugin Picker and pick an effect"],"answer":0,"explanation":"Recording starts in the Mixer (F9) on a free Insert Track. The Browser is for loading existing media, not recording.","source":"§ 23 Audio Recording > Step 1"},{"id":"mcq-23-2","topic":"23 Audio Recording","question":"Where on a Mixer track do you choose the audio interface input, such as In 1?","options":["At the bottom, next to arm","At the top of the track","Inside effect slot 1","In the channel settings panel"],"answer":1,"explanation":"The input source is set at the top of the track. The record-arm button is the control at the bottom.","source":"§ 23 Audio Recording > Step 2"},{"id":"mcq-23-3","topic":"23 Audio Recording","question":"Which item must be ticked in the main Record button's right-click menu to record audio?","options":["Automation","Apply tempo","Audio","Snap"],"answer":2,"explanation":"Audio must be ticked to record audio. Automation, in the same menu, records knob movements instead.","source":"§ 23 Audio Recording > Step 4"},{"id":"mcq-23-4","topic":"23 Audio Recording","question":"After recording audio, what does FL Studio create?","options":["An Automation Clip and Event Data","A Sampler Channel in the Channel Rack","A Pattern Clip on a Clip Track","An Audio Clip and a linked Audio Track"],"answer":3,"explanation":"The recording appears as an Audio Clip, with an Audio Track created and linked automatically. A Sampler Channel is what you get from dragging audio into the Channel Rack.","source":"§ 23 Audio Recording > Step 5"},{"id":"mcq-24-1","topic":"24 Recording & Editing Automation","question":"You want to record a filter sweep by
